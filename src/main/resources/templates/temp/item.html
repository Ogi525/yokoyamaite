<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title th:text="${product.name} + ' | 横山蒸留所'"></title>

	<style>
		  /* ===== 共通ヘッダー・フッター ===== */
		  header { background: white; padding: 20px; border-radius: 20px; margin-bottom: 30px; }
		  .top-menu { display: flex; justify-content: space-between; align-items: center; }
		  .logo { font-size: 32px; font-weight: bold; color: #1a2a4a; }
		  .logo a { text-decoration: none; color: #1a2a4a; }
		  .nav { display: flex; gap: 20px; }
		  .nav a { text-decoration: none; color: #333; font-weight: bold; }
		  .right-area { display: flex; align-items: center; gap: 20px; }
		  .icon-box { display: flex; gap: 15px; align-items: center; }
		  .icon-btn { font-size: 26px; text-decoration: none; color: #333; transition: 0.2s; }
		  .icon-btn:hover { transform: scale(1.2); color: #1a2a4a; }
		  footer { background: white; padding: 25px; border-radius: 20px; text-align: center; }
		  footer a { text-decoration: none; color: #333; margin: 0 10px; }

		  /* ===== 以下、既存のitem.html用スタイル ===== */
		 
		body {
			margin: 0;
			padding: 0;
			background: #f5f5f5;
			font-family: sans-serif;
			color: #333;
		}

		.container {
			width: 95%;
			max-width: 1300px;
			margin: 30px auto;
		}

		/* =========================
		   商品詳細
		========================= */

		.item-wrapper {
			background: white;
			border-radius: 25px;
			padding: 25px 35px;
		}

		/* 戻る */

		.back-link {
			text-decoration: none;
			color: #333;
			font-weight: bold;
			display: inline-block;
			margin-bottom: 25px;
		}

		/* 上段 */

		.item-top {
			display: flex;
			gap: 40px;
			margin-bottom: 50px;
			align-items: flex-start;
		}
		/* 左画像 */

		.item-image {
			width: 640px;
			flex-shrink: 0;
		}

		.item-image img {
			width: 100%;

			aspect-ratio: 4 / 3;

			object-fit: cover;

			border-radius: 24px;
			background: #eee;
			border: 3px solid #ddd;

			display: block;
		}
		/* 右情報 */

		.item-info {
			flex: 1;

			display: flex;
			flex-direction: column;

			justify-content: space-between;

			height: 100%;
		}

		/* 商品名 */

		.item-name-box {
			padding-bottom: 10px;
			border-bottom: 2px solid #e5e5e5;
		}

		.item-name {
			font-size: 38px;
			font-weight: bold;
			line-height: 1.4;
		}

		/* 説明 */

		.short-description {
			line-height: 2;
			color: #555;
			font-size: 16px;

			padding: 5px 0;

			min-height: 170px;
		}

		/* 価格 */

		.price-box {
			padding-top: 10px;
		}

		.item-id {
			color: #777;
			margin-bottom: 10px;

			font-size: 13px;
		}

		.price {
			font-size: 42px;
			font-weight: bold;
			color: #005b96;
			margin-bottom: 20px;
		}

		/* 数量 */

		.quantity-area {
			display: flex;
			align-items: center;
			gap: 14px;

			margin-bottom: 18px;
		}

		.qty-btn {
			width: 46px;
			height: 46px;

			border: none;

			background: #d9d9d9;

			border-radius: 10px;

			font-size: 24px;

			cursor: pointer;

			transition: 0.2s;
		}

		.qty-btn:hover {
			background: #c4c4c4;
		}

		.qty-number {
			font-size: 28px;
			font-weight: bold;
			width: 40px;
			text-align: center;
		}

		/* ボタン */

		.cart-btn {

			width: 100%;

			border: none;

			background: #005b96;

			color: white;

			padding: 14px;

			border-radius: 14px;

			font-size: 17px;

			font-weight: bold;

			cursor: pointer;

			transition: 0.2s;
		}

		.cart-btn:hover {
			background: #003f68;
		}

		/* =========================
		   タブ
		========================= */

		.tab-menu {
			display: flex;
			margin-bottom: 30px;
		}

		.tab-btn {

			flex: 1;

			padding: 15px;

			border: none;

			background: transparent;

			border-bottom: 2px solid #ddd;

			cursor: pointer;

			font-size: 16px;

			font-weight: bold;

			transition: 0.2s;
		}

		.tab-btn:first-child {
			border-radius: 0;
		}

		.tab-btn:last-child {
			border-radius: 0;
		}

		.tab-btn.active {
			border-bottom: 3px solid #005b96;
			color: #005b96;
		}

		/* =========================
		   タブコンテンツ
		========================= */

		.tab-content {
			display: none;
		}

		.tab-content.active {
			display: block;
		}

		/* =========================
		   商品説明
		========================= */

		.description-box {
			line-height: 2;
			color: #555;
			font-size: 16px;
			padding: 10px 0;
		}

		/* =========================
		   レビュー
		========================= */

		.review-top {

			display: flex;

			justify-content: space-between;

			align-items: center;

			flex-wrap: wrap;

			gap: 20px;

			margin-bottom: 30px;
		}

		.review-score {
			font-size: 24px;
			font-weight: bold;
		}

		.review-btn {
			border: none;
			background: #d9d9d9;
			padding: 12px 20px;
			border-radius: 10px;
			cursor: pointer;
			transition: 0.2s;
		}

		.review-btn:hover {
			background: #c8c8c8;
		}

		.review-note {
			background: #f8f8f8;
			border: 1px solid #e5e5e5;
			border-radius: 12px;
			padding: 15px;
			width: 320px;
			font-size: 14px;
			line-height: 1.7;
		}

		/* カード */

		.review-list,
		.comment-list {

			display: flex;

			gap: 20px;

			flex-wrap: wrap;
		}

		.review-card,
		.comment-card {

			width: 260px;

			min-height: 180px;

			background: #fafafa;

			border: 1px solid #e5e5e5;

			border-radius: 18px;

			padding: 20px;

			box-sizing: border-box;
		}

		.user-name {
			font-weight: bold;
			margin-bottom: 8px;
		}

		.post-date {
			color: #666;
			margin-bottom: 12px;
			font-size: 13px;
		}

		.star {
			font-size: 22px;
			margin-bottom: 15px;
		}

		/* =========================
		   レスポンシブ
		========================= */

		@media screen and (max-width:900px) {

			.item-top {
				flex-direction: column;
			}

			.item-image {
				width: 100%;
			}

			.item-image img {
				height: auto;
			}

			.review-note {
				width: 100%;
			}
		}
	</style>

</head>

<body>

	<div class="container">

		<div th:replace="~{layout/_header :: header}"></div>
		<!-- 商品詳細 -->
		<div class="item-wrapper">

			<!-- 戻る -->
			<a href="/" class="back-link">
				← 商品一覧へ戻る
			</a>

			<!-- 上段 -->
			<div class="item-top">

				<!-- 商品画像 -->
				<div class="item-image">

					<img th:src="${product.imageUrl}" th:alt="${product.name}">

				</div>

				<!-- 商品情報 -->
				<div class="item-info">

					<!-- 商品名 -->
					<div class="item-name-box">

						<div class="item-name" th:text="${product.name}">
							商品名
						</div>

					</div>

					<!-- 説明 -->
					<div class="short-description" th:text="${product.description}">
						商品説明
					</div>

					<!-- 購入 -->
					<div class="price-box">

						<div class="item-id">
							商品ID :
							<span th:text="${product.id}"></span>
						</div>

						<div class="price">

							¥<span th:text="${product.price}"></span>

						</div>

						<!-- 数量 -->
						<div class="quantity-area">

							<button class="qty-btn" onclick="decreaseQty()">
								−
							</button>

							<div class="qty-number" id="qty">
								1
							</div>

							<button class="qty-btn" onclick="increaseQty()">
								＋
							</button>

						</div>

						<!-- カート -->
						<button class="cart-btn">
							カートに入れる
						</button>

					</div>

				</div>

			</div>

			<!-- タブ -->
			<div class="tab-menu">

				<button class="tab-btn active" onclick="showTab('description', this)">
					商品説明
				</button>

				<button class="tab-btn" onclick="showTab('review', this)">
					レビュー
				</button>

				<button class="tab-btn" onclick="showTab('comment', this)">
					コメント
				</button>

			</div>

			<!-- 商品説明 -->
			<div id="description" class="tab-content active">

				<div class="description-box" th:text="${product.description}">
				</div>

			</div>

			<!-- レビュー -->
			<div id="review" class="tab-content">

				<div class="review-top">

					<div class="review-score">
						レビュー ★★★★☆
					</div>

					<button class="review-btn">
						レビューを書く
					</button>

					<div class="review-note">

						レビューは購入者のみ投稿できます。<br>
						ログイン後に購入履歴が確認できる場合のみ投稿可能です。

					</div>

				</div>

				<div class="review-list">

					<div class="review-card">

						<div class="user-name">
							ユーザー名
						</div>

						<div class="post-date">
							投稿日 2026/5/13
						</div>

						<div class="star">
							★★★★★
						</div>

						<div>
							とても美味しかったです！
						</div>

					</div>

				</div>

			</div>

			<!-- コメント -->
			<div id="comment" class="tab-content">

				<div class="review-top">

					<div class="review-score">
						コメント
					</div>

					<button class="review-btn">
						コメントを書く
					</button>

					<div class="review-note">
						コメントはログインユーザーのみ投稿可能です。
					</div>

				</div>

				<div class="comment-list">

					<div class="comment-card">

						<div class="user-name">
							ユーザー名
						</div>

						<div class="post-date">
							投稿日 2026/5/13
						</div>

						<div>
							食べてみたい！
						</div>

					</div>

				</div>

			</div>

		</div>

		<div th:replace="~{layout/_footer :: footer}"></div>

	</div>

	<script>

		let qty = 1;

		function increaseQty() {

			qty++;

			document.getElementById("qty").textContent = qty;
		}

		function decreaseQty() {

			if (qty > 1) {

				qty--;

				document.getElementById("qty").textContent = qty;
			}
		}

		function showTab(tabId, btn) {

			document.querySelectorAll(".tab-content")
				.forEach(tab => {
					tab.classList.remove("active");
				});

			document.querySelectorAll(".tab-btn")
				.forEach(button => {
					button.classList.remove("active");
				});

			document.getElementById(tabId)
				.classList.add("active");

			btn.classList.add("active");
		}

	</script>

</body>

</html>

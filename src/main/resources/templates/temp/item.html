<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title th:text="${product.name} + ' | 横山蒸留所'"></title>

	<style>
		body {
			margin: 0;
			padding: 0;
			background: #f5f5f5;
			font-family: sans-serif;
			color: #333;
		}

		.container {
			width: 95%;
			max-width: 1300px;
			margin: 30px auto;
		}

		/* =========================
		   ヘッダー
		========================= */

		header {
			background: white;
			padding: 20px;
			border-radius: 20px;
			margin-bottom: 30px;
		}

		.top-menu {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.logo {
			font-size: 32px;
			font-weight: bold;
			color: #005b96;
		}

		.logo a {
			text-decoration: none;
			color: #005b96;
		}

		.nav {
			display: flex;
			gap: 20px;
		}

		.nav a {
			text-decoration: none;
			color: #333;
			font-weight: bold;
		}

		/* 右側 */
		.right-area {
			display: flex;
			align-items: center;
			gap: 20px;
		}


		.icon-box {
			display: flex;
			gap: 15px;
			align-items: center;
		}

		.icon-btn {
			font-size: 26px;
			text-decoration: none;
			color: #333;
			transition: 0.2s;
		}

		.icon-btn:hover {
			transform: scale(1.2);
			color: #005b96;
		}

		.search-wrapper {
			display: flex;
			justify-content: center;
		}

		.search-box {
			width: 100%;
			max-width: 1100px;

			background: white;

			padding: 25px;

			border-radius: 25px;

			box-shadow:
				0 5px 15px rgba(0, 0, 0, 0.08);

			border: 3px solid #b7d8ef;
		}

		/* =========================
   商品詳細
========================= */

		.item-wrapper {
			background: white;
			border-radius: 25px;
			padding: 35px;
		}

		/* 戻る */

		.back-link {
			text-decoration: none;
			color: #333;
			font-weight: bold;
			display: inline-block;
			margin-bottom: 25px;
		}

		/* 上段 */

		.item-top {
			display: flex;
			gap: 40px;
			margin-bottom: 50px;
		}

		/* 左画像 */

		.item-image {
			width: 450px;
			flex-shrink: 0;
		}

		.item-image img {
			width: 100%;
			height: 450px;
			object-fit: cover;

			border-radius: 20px;

			background: #eee;

			border: 3px solid #ddd;
		}

		/* 右情報 */

		.item-info {
			flex: 1;

			display: flex;
			flex-direction: column;
			gap: 25px;
		}

		/* 商品名 */

		.item-name-box {
			background: #fafafa;
			border: 2px solid #d0d7de;
			border-radius: 18px;
			padding: 25px;
		}

		.item-name {
			font-size: 38px;
			font-weight: bold;
		}

		/* 説明 */

		.short-description {
			line-height: 1.8;
			color: #666;
			font-size: 17px;
		}

		/* 価格 */

		.price-box {
			background: #fafafa;
			border-radius: 18px;
			border: 2px solid #d0d7de;

			padding: 25px;
		}

		.item-id {
			color: #777;
			margin-bottom: 15px;
		}

		.price {
			font-size: 42px;
			font-weight: bold;
			color: #005b96;
			margin-bottom: 25px;
		}

		/* 数量 */

		.quantity-area {
			display: flex;
			align-items: center;
			gap: 20px;

			margin-bottom: 25px;
		}

		.qty-btn {
			width: 55px;
			height: 55px;

			border: none;

			background: #d9d9d9;

			border-radius: 12px;

			font-size: 28px;

			cursor: pointer;

			transition: 0.2s;
		}

		.qty-btn:hover {
			background: #c4c4c4;
		}

		.qty-number {
			font-size: 32px;
			font-weight: bold;
			width: 40px;
			text-align: center;
		}

		/* ボタン */

		.cart-btn {

			width: 100%;

			border: none;

			background: #005b96;

			color: white;

			padding: 18px;

			border-radius: 15px;

			font-size: 20px;

			font-weight: bold;

			cursor: pointer;

			transition: 0.2s;
		}

		.cart-btn:hover {
			background: #003f68;
		}

		/* =========================
   タブ
========================= */

		.tab-menu {
			display: flex;
			margin-bottom: 30px;
		}

		.tab-btn {

			flex: 1;

			padding: 18px;

			border: none;

			background: #e0e0e0;

			cursor: pointer;

			font-size: 18px;

			font-weight: bold;

			transition: 0.2s;
		}

		.tab-btn:first-child {
			border-radius: 15px 0 0 15px;
		}

		.tab-btn:last-child {
			border-radius: 0 15px 15px 0;
		}

		.tab-btn.active {
			background: #a9c7e5;
		}

		/* =========================
   タブコンテンツ
========================= */

		.tab-content {
			display: none;
		}

		.tab-content.active {
			display: block;
		}

		/* =========================
   商品説明
========================= */

		.description-box {
			background: #fafafa;
			padding: 30px;
			border-radius: 20px;
			line-height: 2;
		}

		/* =========================
   レビュー
========================= */

		.review-top {

			display: flex;

			justify-content: space-between;

			align-items: center;

			flex-wrap: wrap;

			gap: 20px;

			margin-bottom: 30px;
		}

		.review-score {
			font-size: 24px;
			font-weight: bold;
		}

		.review-btn {
			border: none;
			background: #d9d9d9;
			padding: 15px 25px;
			border-radius: 12px;
			cursor: pointer;
		}

		.review-note {
			background: #f5f5f5;
			border: 2px solid #cfd8dc;
			border-radius: 12px;
			padding: 15px;
			width: 320px;
			font-size: 14px;
		}

		/* カード */

		.review-list,
		.comment-list {

			display: flex;

			gap: 20px;

			flex-wrap: wrap;
		}

		.review-card,
		.comment-card {

			width: 260px;

			min-height: 180px;

			background: #fafafa;

			border: 2px solid #ccc;

			border-radius: 20px;

			padding: 20px;

			box-sizing: border-box;
		}

		.user-name {
			font-weight: bold;
			margin-bottom: 8px;
		}

		.post-date {
			color: #666;
			margin-bottom: 12px;
		}

		.star {
			font-size: 22px;
			
			margin-bottom: 15px;
		}
		
				/* =========================
		   フッター
		========================= */

				footer {

					background: white;

					padding: 25px;

					border-radius: 20px;

					text-align: center;
				}

				footer a {
					text-decoration: none;
					color: #333;
					margin: 0 10px;
				}

		/* =========================
   レスポンシブ
========================= */

		@media screen and (max-width:900px) {

			.item-top {
				flex-direction: column;
			}

			.item-image {
				width: 100%;
			}

			.item-image img {
				height: auto;
			}

			.review-note {
				width: 100%;
			}
		}
	</style>

</head>

<body>

	<div class="container">

		<div th:replace="~{layout/_header :: header}"></div>

		<!-- 商品詳細 -->
		<div class="item-wrapper">

			<!-- 戻る -->
			<a href="/" class="back-link">
				← 商品一覧へ戻る
			</a>

			<!-- 上段 -->
			<div class="item-top">

				<!-- 商品画像 -->
				<div class="item-image">

					<img th:src="${product.imageUrl}" th:alt="${product.name}">

				</div>

				<!-- 商品情報 -->
				<div class="item-info">

					<!-- 商品名 -->
					<div class="item-name-box">

						<div class="item-name" th:text="${product.name}">
							商品名
						</div>

					</div>

					<!-- 説明 -->
					<div class="short-description" th:text="${product.description}">
						商品説明
					</div>

					<!-- 購入 -->
					<div class="price-box">

						<div class="item-id">
							商品ID :
							<span th:text="${product.id}"></span>
						</div>

						<div class="price">

							¥<span th:text="${product.price}"></span>

						</div>

						<!-- 数量 -->
						<div class="quantity-area">

							<button class="qty-btn" onclick="decreaseQty()">
								−
							</button>

							<div class="qty-number" id="qty">
								1
							</div>

							<button class="qty-btn" onclick="increaseQty()">
								＋
							</button>

						</div>

						<!-- カート -->
						<button class="cart-btn">
							カートに入れる
						</button>

					</div>

				</div>

			</div>

			<!-- タブ -->
			<div class="tab-menu">

				<button class="tab-btn active" onclick="showTab('description', this)">
					商品説明
				</button>

				<button class="tab-btn" onclick="showTab('review', this)">
					レビュー
				</button>

				<button class="tab-btn" onclick="showTab('comment', this)">
					コメント
				</button>

			</div>

			<!-- 商品説明 -->
			<div id="description" class="tab-content active">

				<div class="description-box" th:text="${product.description}">
				</div>

			</div>

			<!-- レビュー -->
			<div id="review" class="tab-content">

				<div class="review-top">

					<div class="review-score">
						レビュー ★★★★☆
					</div>

					<button class="review-btn">
						レビューを書く
					</button>

					<div class="review-note">

						レビューは購入者のみ投稿できます。<br>
						ログイン後に購入履歴が確認できる場合のみ投稿可能です。

					</div>

				</div>

				<div class="review-list">

					<div class="review-card">

						<div class="user-name">
							ユーザー名
						</div>

						<div class="post-date">
							投稿日 2026/5/13
						</div>

						<div class="star">
							★★★★★
						</div>

						<div>
							とても美味しかったです！
						</div>

					</div>

				</div>

			</div>

			<!-- コメント -->
			<div id="comment" class="tab-content">

				<div class="review-top">

					<div class="review-score">
						コメント
					</div>

					<button class="review-btn">
						コメントを書く
					</button>

					<div class="review-note">

						コメントはログインユーザーのみ投稿可能です。

					</div>

				</div>

				<div class="comment-list">

					<div class="comment-card">

						<div class="user-name">
							ユーザー名
						</div>

						<div class="post-date">
							投稿日 2026/5/13
						</div>

						<div>
							食べてみたい！
						</div>

					</div>

				</div>

			</div>

		</div>
		<div th:replace="~{layout/_footer :: footer}"></div>

	</div>

	<script>

		/* 数量 */

		let qty = 1;

		function increaseQty() {

			qty++;

			document.getElementById("qty").textContent = qty;
		}

		function decreaseQty() {

			if (qty > 1) {

				qty--;

				document.getElementById("qty").textContent = qty;
			}
		}

		/* タブ切替 */

		function showTab(tabId, btn) {

			document.querySelectorAll(".tab-content")
				.forEach(tab => {
					tab.classList.remove("active");
				});

			document.querySelectorAll(".tab-btn")
				.forEach(button => {
					button.classList.remove("active");
				});

			document.getElementById(tabId)
				.classList.add("active");

			btn.classList.add("active");
		}

	</script>

</body>

</html>

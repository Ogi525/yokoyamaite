<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title th:text="${product.name} + ' | 横山蒸留所'"></title>

	<style>
		/* =========================
		   共通
		========================= */

		body {
			margin: 0;
			padding: 0;
			background: #f5f5f5;
			font-family: sans-serif;
			color: #333;
		}

		.container {
			width: 95%;
			max-width: 1300px;
			margin: 30px auto;
		}

		/* =========================
		   ヘッダー・フッター
		========================= */

		header {
			background: white;
			padding: 20px;
			border-radius: 20px;
			margin-bottom: 30px;
		}

		.top-menu {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.logo {
			font-size: 32px;
			font-weight: bold;
			color: #1a2a4a;
		}

		.logo a {
			text-decoration: none;
			color: #1a2a4a;
		}

		.nav {
			display: flex;
			gap: 20px;
		}

		.nav a {
			text-decoration: none;
			color: #333;
			font-weight: bold;
		}

		.right-area {
			display: flex;
			align-items: center;
			gap: 20px;
		}

		.icon-box {
			display: flex;
			gap: 15px;
			align-items: center;
		}

		.icon-btn {
			font-size: 26px;
			text-decoration: none;
			color: #333;
			transition: 0.2s;
		}

		.icon-btn:hover {
			transform: scale(1.2);
			color: #1a2a4a;
		}

		footer {
			background: white;
			padding: 25px;
			border-radius: 20px;
			text-align: center;
			margin-top: 40px;
		}

		footer a {
			text-decoration: none;
			color: #333;
			margin: 0 10px;
		}

		/* =========================
		   商品詳細
		========================= */

		.item-wrapper {
			background: white;
			border-radius: 25px;
			padding: 30px 35px;
		}

		.back-link {
			text-decoration: none;
			color: #333;
			font-weight: bold;
			display: inline-block;
			margin-bottom: 25px;
		}

		.item-top {
			display: flex;
			gap: 40px;
			margin-bottom: 50px;
			align-items: flex-start;
		}

		/* =========================
		   商品画像
		========================= */

		.item-image {
			width: 620px;
			flex-shrink: 0;
		}

		.item-image img {
			width: 100%;
			aspect-ratio: 4 / 3;
			object-fit: contain;
			border-radius: 24px;
			border: 3px solid #ddd;
			background: #eee;
			display: block;
		}

		/* =========================
		   商品情報
		========================= */

		.item-info {
			flex: 1;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			height: 100%;
		}

		.item-name-box {
			padding-bottom: 14px;
			border-bottom: 2px solid #e5e5e5;
			margin-bottom: 20px;
		}

		.item-name {
			font-size: 38px;
			font-weight: bold;
			line-height: 1.4;
			color: #1a2a4a;
		}

		.short-description {
			line-height: 2;
			color: #555;
			font-size: 16px;
			min-height: 170px;
		}

		.price-box {
			padding-top: 15px;
		}

		.item-id {
			color: #777;
			margin-bottom: 12px;
			font-size: 13px;
		}

		.price {
			font-size: 42px;
			font-weight: bold;
			color: #005b96;
			margin-bottom: 25px;
		}

		/* =========================
		   数量
		========================= */

		.quantity-area {
			display: flex;
			align-items: center;
			gap: 15px;
			background: #f5f8fc;
			padding: 12px 18px;
			border-radius: 18px;
			width: fit-content;
			margin-bottom: 22px;
		}

		.qty-btn {
			width: 46px;
			height: 46px;
			border: none;
			border-radius: 12px;
			background: #1a2a4a;
			color: white;
			font-size: 24px;
			cursor: pointer;
			transition: 0.2s;
		}

		.qty-btn:hover {
			background: #2a3d63;
			transform: scale(1.05);
		}

		.qty-number {
			font-size: 28px;
			font-weight: bold;
			width: 40px;
			text-align: center;
			color: #1a2a4a;
		}

		/* =========================
		   カートボタン
		========================= */

		.cart-btn {
			width: 100%;
			border: none;
			background: #1a2a4a;
			color: white;
			padding: 16px;
			border-radius: 16px;
			font-size: 18px;
			font-weight: bold;
			cursor: pointer;
			transition: 0.2s;
		}

		.cart-btn:hover {
			background: #2a3d63;
			transform: translateY(-2px);
		}

		/* =========================
		   タブ
		========================= */

		.tab-menu {
			display: flex;
			margin-bottom: 30px;
			border-bottom: 2px solid #ddd;
		}

		.tab-btn {
			flex: 1;
			padding: 16px;
			border: none;
			background: transparent;
			cursor: pointer;
			font-size: 16px;
			font-weight: bold;
			transition: 0.2s;
			border-bottom: 3px solid transparent;
		}

		.tab-btn.active {
			border-bottom: 3px solid #005b96;
			color: #005b96;
		}

		/* =========================
		   タブコンテンツ
		========================= */

		.tab-content {
			display: none;
		}

		.tab-content.active {
			display: block;
		}

		/* =========================
		   商品説明
		========================= */

		.description-box {
			line-height: 2;
			color: #555;
			font-size: 16px;
			padding: 10px 0;
		}

		/* =========================
		   レビュー
		========================= */

		.review-top {

			display: flex;

			justify-content: space-between;

			align-items: center;

			flex-wrap: wrap;

			gap: 20px;

			margin-bottom: 30px;
		}

		.review-score {
			font-size: 24px;
			font-weight: bold;
		}

		.review-btn {
			border: none;
			background: #d9d9d9;
			padding: 15px 25px;
			border-radius: 12px;
			cursor: pointer;
		}

		.review-note {
			background: #f5f5f5;
			border: 2px solid #cfd8dc;
			border-radius: 12px;
			padding: 15px;
			width: 320px;
			font-size: 14px;
		}

		/* カード */

		.review-list {

			display: flex;

			gap: 20px;

			flex-wrap: wrap;
		}

		.comment-list {

			display: flex;

			flex-direction: column;

			gap: 24px;
		}

		.comment-card {
			width: 100%;
			max-width: 820px;
			padding: 20px;
			border-radius: 20px;
			background: #f5f5f5;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
		}

		.comment-header {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 16px;
			margin-bottom: 12px;
		}

		.reply-area {
			margin-top: 12px;
			padding-top: 12px;
			border-top: 1px solid #d8d8d8;
		}

		.reply-card {
			margin-top: 12px;
			padding: 14px;
			border-radius: 16px;
			background: #ffffff;
			border: 1px solid #dcdcdc;
		}

		.reply-count {
			font-size: 14px;
			color: #444;
			margin-bottom: 10px;
		}

		.reply-form {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			margin-top: 16px;
		}

		.reply-form input[type="text"] {
			flex: 1;
			min-width: 180px;
			padding: 12px 14px;
			border-radius: 16px;
			border: 1px solid #ccc;
			background: #fff;
		}

		.reply-form button,
		.toggle-replies,
		.delete-button {
			border: none;
			background: #3b82f6;
			color: white;
			padding: 10px 16px;
			border-radius: 14px;
			cursor: pointer;
		}

		.toggle-replies {
			background: #2563eb;
		}

		.delete-button {
			background: #ef4444;
		}

		.review-card {

			width: 260px;

			min-height: 180px;

			background: #fafafa;

			border: 2px solid #ccc;

			border-radius: 20px;

			padding: 20px;

			box-sizing: border-box;
		}

		.user-name {
			font-weight: bold;
			margin-bottom: 8px;
		}

		.post-date {
			color: #666;
			margin-bottom: 12px;
		}

		.star {
			font-size: 22px;

			margin-bottom: 15px;
		}

		/* =========================
		   レスポンシブ
		========================= */

		@media screen and (max-width: 900px) {

			.item-top {
				flex-direction: column;
			}

			.item-image {
				width: 100%;
			}

			.item-image img {
				height: auto;
			}

			.review-note {
				width: 100%;
			}

			.review-list {
				flex-direction: column;
			}

			.review-card {
				width: 100%;
			}
		}
	</style>

</head>

<body>

	<div class="container">

		<div th:replace="~{layout/_header :: header}"></div>

		<!-- 商品詳細 -->
		<div class="item-wrapper">
			<div th:if="${couponMessage}"
				style="background:#fff3cd; color:#856404; padding:15px; border-radius:10px; margin-bottom:20px;"
				th:text="${couponMessage}">
			</div>

			<a href="javascript:history.back()" class="back-link">
				← 商品一覧へ戻る
			</a>

			<div class="item-top">

				<!-- 商品画像 -->
				<div class="item-image">

					<img th:src="${product.imageUrl}" th:alt="${product.name}">

				</div>

				<!-- 商品情報 -->
				<div class="item-info">

					<div>

						<div class="item-name-box">

							<div class="item-name" th:text="${product.name}">
								商品名
							</div>

						</div>

						<div>
						
						</div>

					</div>

					<div class="price-box">

						<div class="item-id">
							商品ID :
							<span th:text="${product.id}"></span>
						</div>

						<div class="price">
							¥<span th:text="${#numbers.formatInteger(product.price, 1, 'COMMA')}"></span>
						</div>

						<!-- 数量 -->
						<div class="quantity-area" th:if="${!product.hidden}">

							<button type="button" class="qty-btn" onclick="decreaseQty()">
								−
							</button>

							<div class="qty-number" id="qty">
								1
							</div>

							<button type="button" class="qty-btn" th:onclick="'increaseQty(' + ${product.stock} + ')'">
								＋
							</button>

						</div>

						<!-- カート -->
						<form th:action="@{/cart/add}" method="post">

							<input type="hidden" name="productId" th:value="${product.id}">

							<input type="hidden" name="quantity" id="quantityInput" value="1">

							<button type="submit" class="cart-btn">
								カートに入れる
							</button>

						</form>

					</div>

				</div>

			</div>

			<!-- タブ -->
			<div class="tab-menu">

				<button id="descriptionTabBtn" class="tab-btn active" onclick="showTab('description', this)">
					商品説明
				</button>

				<button id="reviewTabBtn" class="tab-btn" onclick="showTab('review', this)">
					レビュー
				</button>

				<button id="commentTabBtn" class="tab-btn" onclick="showTab('commentTabContent', this)">
					コメント
				</button>

			</div>

			<!-- 商品説明 -->
			<div id="description" class="tab-content active">

				<div class="description-box" th:text="${product.description}">
				</div>

			</div>

			<!-- レビュー -->
			<div id="review" class="tab-content">

				<!-- レビュー一覧 -->
				<h2>レビュー一覧</h2>

				<div th:if="${#lists.isEmpty(reviews)}" style="color:#888; margin-bottom:20px;">
					まだレビューはありません。
				</div>

				<div class="review-list">
					<div class="review-card" th:each="review : ${reviews}">

						<div class="user-name" th:text="${review.userName}">ユーザー名</div>

						<div class="post-date" th:text="${#temporals.format(review.createdAt, 'yyyy/MM/dd')}">投稿日</div>

						<div class="star">
							<span th:each="i : ${#numbers.sequence(1, review.rating)}">★</span>
							<span th:each="i : ${#numbers.sequence(review.rating + 1, 5)}" style="color:#ccc;">★</span>
						</div>

						<div th:text="${review.comment}">本文</div>

					</div>
				</div>

				<!-- 投稿フォーム -->
				<div style="margin-top:40px;">

					<div th:if="${session.loginUser == null}">
						<p><a th:href="@{/login(redirectUrl='/item/' + ${product.id} + '?tab=review')}">ログイン</a>して購入済みの場合はレビューを投稿できます。</p>
					</div>

					<div th:if="${session.loginUser != null}">
						<h3>レビューを投稿する</h3>

						<!-- エラーメッセージ -->
						<div th:if="${reviewError}" style="color:red; margin-bottom:15px;" th:text="${reviewError}">
						</div>

						<form th:action="@{/item/{id}/reviews(id=${product.id})}" th:object="${reviewForm}"
							method="post">

							<div style="margin-bottom:15px;">
								<label>評価</label><br>
								<select th:field="*{rating}"
									style="padding:8px; border-radius:8px; border:1px solid #ccc;">
									<option value="">選択してください</option>
									<option value="1">★1</option>
									<option value="2">★2</option>
									<option value="3">★3</option>
									<option value="4">★4</option>
									<option value="5">★5</option>
								</select>
								<div th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"
									style="color:red; font-size:13px;">
								</div>
							</div>

							<div style="margin-bottom:15px;">
								<p style="font-size:13px; color:#666;">
									100文字以上のレビュー投稿で500円クーポンをプレゼント！
								</p>
								<label>コメント</label><br>
								<textarea th:field="*{comment}" rows="4" maxlength="200" placeholder="200文字以内で入力してください"
									style="width:100%; max-width:600px; padding:10px; border-radius:8px; border:1px solid #ccc;">
									</textarea>
								<div th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}"
									style="color:red; font-size:13px;">
								</div>
							</div>

							<button type="submit" class="cart-btn" style="max-width:200px;">
								レビューを投稿する
							</button>

						</form>
					</div>

				</div>

			</div>
			<!-- コメント -->
			<div id="commentTabContent" class="tab-content">

				<div class="comment-card" style="margin-bottom:20px;">
					<div class="user-name">コメントを投稿</div>
					<form th:action="@{/post}" method="post" class="reply-form">
						<input type="hidden" name="productId" th:value="${product.id}">
						<input type="text" name="body" placeholder="コメントを入力してください" required>
						<button type="submit">投稿</button>
					</form>
				</div>

				<th:block th:fragment="renderReplies(replies, level)">
					<div th:each="reply : ${replies}">
						<div class="reply-card" th:style="'margin-left:' + (${level} * 20) + 'px'">
							<div class="user-name" th:text="${reply.userName}"></div>
							<div class="post-date" th:text="${reply.createdAt}"></div>
							<div class="comment-body" th:text="${reply.body}"></div>
							<div th:if="${reply.replies != null and !#lists.isEmpty(reply.replies)}"
								th:insert="~{this::renderReplies(replies=${reply.replies}, level=${level + 1})}">
							</div>
						</div>
					</div>
				</th:block>

				<div class="comment-list">

					<div class="comment-card" th:each="comment : ${comments}">

						<div class="comment-header">
							<div>
								<div class="user-name" th:text="${comment.userName}"></div>
								<div class="post-date" th:text="${comment.createdAt}"></div>
							</div>
							<form
								th:if="${session.loginUser != null and session.loginUser.id == comment.userId and comment.parentId == null}"
								th:action="@{/post/{postId}/delete(postId=${comment.id})}" method="post">
								<input type="hidden" name="productId" th:value="${product.id}">
								<button type="submit" class="delete-button">削除</button>
							</form>
						</div>

						<div class="comment-body" th:text="${comment.body}"></div>

						<button type="button" class="toggle-replies"
							th:if="${comment.replies != null and !#lists.isEmpty(comment.replies)}"
							th:onclick="'toggleReplySection(' + ${comment.id} + ')'">
							返信を見る
						</button>

						<div class="reply-area" th:id="'replyArea-' + ${comment.id}" style="display:none;">
							<div class="reply-count" th:text="'返信 ' + ${#lists.size(comment.replies)} + ' 件'"
								th:if="${comment.replies != null and !#lists.isEmpty(comment.replies)}"></div>
							<div th:if="${comment.replies != null and !#lists.isEmpty(comment.replies)}"
								th:insert="~{this::renderReplies(replies=${comment.replies}, level=1)}"></div>
							<div th:if="${comment.replies == null or #lists.isEmpty(comment.replies)}"
								class="reply-count">
								返信はまだありません
							</div>
						</div>

						<form th:action="@{/post}" method="post" class="reply-form">
							<input type="hidden" name="parentId" th:value="${comment.id}">
							<input type="hidden" name="productId" th:value="${product.id}">
							<input type="text" name="body" placeholder="返信を書く..." required>
							<button type="submit">返信</button>
						</form>

					</div>

				</div>

			</div>
			<div th:replace="~{layout/_footer :: footer}"></div>

		</div>

		<script>

				/* =========================
				   数量
				========================= */

				let qty = 1;

				/* 初期同期 */
				window.addEventListener("load", () => {

					updateQuantity();

					restoreActiveTab();
				});

				/* 数量表示とhidden input同期 */
				function updateQuantity() {

					const qtyText =
						document.getElementById("qty");

					const qtyInput =
						document.getElementById("quantityInput");

					if (qtyText) {
						qtyText.textContent = qty;
					}

					if (qtyInput) {
						qtyInput.value = qty;
					}
				}

				/* ＋ */
				function increaseQty(stock) {

					if (qty < stock) {

						qty++;

						updateQuantity();
					}
				}

				/* − */
				function decreaseQty() {

					if (qty > 1) {

						qty--;

						updateQuantity();
					}
				}

				/* =========================
				   タブ切替
				========================= */

				function showTab(tabId, btn) {

					document.querySelectorAll(".tab-content")
						.forEach(tab => {

							tab.classList.remove("active");

						});

					document.querySelectorAll(".tab-btn")
						.forEach(button => {

							button.classList.remove("active");

						});

					document.getElementById(tabId)
						.classList.add("active");

					btn.classList.add("active");
				}

				/* タブ復元 */
				function restoreActiveTab() {

					const hash =
						location.hash.replace('#', '');

					const params =
						new URLSearchParams(location.search);

					const tab =
						hash || params.get('tab');

					if (!tab) {
						return;
					}

					const btn =
						document.getElementById(tab + 'TabBtn');

					if (btn) {

						showTab(tab, btn);
					}
				}

				/* =========================
				   返信表示トグル
				========================= */

				function toggleReplySection(commentId) {

					const section =
						document.getElementById(
							'replyArea-' + commentId
						);

					if (!section) {
						return;
					}

					section.style.display =
						section.style.display === 'block'
							? 'none'
							: 'block';
				}

			</script>
</body>

</html>

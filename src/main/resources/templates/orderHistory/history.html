<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>購入履歴 | 横山販売所</title>

	<style>
		/* ===== 共通ヘッダー・フッター ===== */
						  header { background: white; padding: 20px; border-radius: 20px; margin-bottom: 30px; }
						  .top-menu { display: flex; justify-content: space-between; align-items: center; }
						  .logo { font-size: 32px; font-weight: bold; color: #1a2a4a; }
						  .logo a { text-decoration: none; color: #1a2a4a; }
						  .nav { display: flex; gap: 20px; }
						  .nav a { text-decoration: none; color: #333; font-weight: bold; }
						  .right-area { display: flex; align-items: center; gap: 20px; }
						  .icon-box { display: flex; gap: 15px; align-items: center; }
						  .icon-btn { font-size: 26px; text-decoration: none; color: #333; transition: 0.2s; }
						  .icon-btn:hover { transform: scale(1.2); color: #1a2a4a; }
						  footer { background: white; padding: 25px; border-radius: 20px; text-align: center; }
						  footer a { text-decoration: none; color: #333; margin: 0 10px; }

						  /* ===== 以下、既存のitem.html用スタイル ===== */
		body {
			margin: 0;
			padding: 0;
			font-family: sans-serif;
			background: #f5f5f5;
			color: #333;
		}

		.container {
			width: 95%;
			max-width: 1400px;
			margin: 30px auto;
		}

		/* =========================
		   メインコンテンツ
		========================= */

		.history-section {
			background: white;
			border-radius: 30px;
			padding: 40px;
			box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
			margin-bottom: 50px;
		}

		.page-title {
			font-size: 42px;
			font-weight: bold;
			color: #1a2a4a;
			margin-bottom: 35px;
			border-left: 10px solid #1a2a4a;
			padding-left: 18px;
		}

		/* =========================
		   履歴カード
		========================= */

		.history-list {
			display: flex;
			flex-direction: column;
			gap: 25px;
		}

		.history-card {
			background: #fafafa;
			border-radius: 25px;
			padding: 25px 30px;
			border: 3px solid #8fa8c8;
			transition: 0.3s;
			box-shadow: 0 5px 12px rgba(0, 0, 0, 0.05);
		}

		.history-card:hover {
			transform: translateY(-5px);
			box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
		}

		.history-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
			flex-wrap: wrap;
			gap: 10px;
		}

		.order-date {
			font-size: 22px;
			font-weight: bold;
			color: #1a2a4a;
		}

		.order-number {
			background: #1a2a4a;
			color: white;
			padding: 8px 16px;
			border-radius: 999px;
			font-size: 14px;
			font-weight: bold;
		}

		.history-body {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
			gap: 20px;
		}

		.info-box {
			background: white;
			border-radius: 18px;
			padding: 18px;
			border: 2px solid #d7e1ec;
		}

		.info-label {
			font-size: 13px;
			color: #777;
			margin-bottom: 8px;
		}

		.info-value {
			font-size: 24px;
			font-weight: bold;
			color: #333;
		}

		/* =========================
		   履歴なし
		========================= */

		.empty-box {
			background: white;
			border-radius: 25px;
			padding: 60px 20px;
			text-align: center;
			font-size: 24px;
			font-weight: bold;
			color: #777;
			border: 3px dashed #ccc;
		}

		/* =========================
		   レスポンシブ
		========================= */

		@media screen and (max-width:768px) {

			.history-section {
				padding: 25px;
			}

			.page-title {
				font-size: 32px;
			}

			.order-date {
				font-size: 18px;
			}

			.info-value {
				font-size: 20px;
			}
		}
	</style>

</head>

<body>

	<div class="container">

		<!-- ヘッダー -->
		<div th:replace="~{layout/_header :: header}"></div>

		<!-- 購入履歴 -->
		<section class="history-section">

			<h1 class="page-title">購入履歴</h1>

			<!-- データがある場合 -->
			<div class="history-list" th:if="${!#lists.isEmpty(orderList)}">

				<div class="history-card"
					 th:each="order, stat : ${orderList}">

					<div class="history-header">
						<div class="order-date"
							 th:text="${order.date}">
						</div>

						<div class="order-number">
							注文 #<span th:text="${stat.count}"></span>
						</div>
					</div>

					<div class="history-body">

						<div class="info-box">
							<div class="info-label">商品ID</div>
							<div class="info-value"
								 th:text="${order.productId}">
							</div>
						</div>

						<div class="info-box">
							<div class="info-label">購入数量</div>
							<div class="info-value">
								<span th:text="${order.quantity}"></span> 個
							</div>
						</div>

					</div>

				</div>

			</div>

			<!-- データがない場合 -->
			<div class="empty-box"
				 th:if="${#lists.isEmpty(orderList)}">

				購入履歴はまだありません 🍣

			</div>

		</section>

		<!-- フッター -->
		<div th:replace="~{layout/_footer :: footer}"></div>

	</div>

</body>

</html>

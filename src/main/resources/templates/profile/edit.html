<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>プロフィール編集</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    main {
      width: 400px;
      margin: 80px auto;
      padding: 50px 75px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 24px;
      color: #1a2a4a;
    }

    .info-block {
      text-align: left;
      margin-bottom: 20px;
    }

    .info-block p {
      font-size: 14px;
      color: #888;
      margin: 0 0 4px 0;
    }

    .info-block input {
      width: 100%;
      font-size: 16px;
      color: #1a2a4a;
      font-weight: bold;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      transition: 0.2s;
    }

    .info-block input:focus {
      outline: none;
      background-color: white;
      border: 1px solid #1a2a4a;
      box-shadow: 0 0 5px rgba(26, 42, 74, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      display: block;
      box-sizing: border-box;
    }

    .btn-submit {
      background-color: #1a2a4a;
      color: white;
      border: none;
      margin-bottom: 10px;
    }

    .btn-submit:hover {
      background-color: #2a4a7a;
    }

    .btn-back {
      background-color: white;
      color: #1a2a4a;
      border: 1px solid #1a2a4a;
    }

    .btn-back:hover {
      background-color: #f0f4ff;
    }
  </style>
</head>
<body>

  <main>
    <h1>プロフィール編集</h1>

    <form th:action="@{/profile/confirm}" method="post">
      <input type="hidden" name="id" th:value="${user.id}">

      <div class="info-block">
        <p>名前</p>
        <input type="text" name="name" th:value="${user.name}" />
      </div>
      <div class="info-block">
        <p>メール</p>
        <input type="email" name="email" th:value="${user.email}" />
      </div>
      <div class="info-block">
        <p>住所</p>
        <input type="text" name="address" th:value="${user.address}" />
      </div>

      <p th:if="${session.errorMessage != null}"
         th:text="${session.errorMessage}"
         style="color:red; text-align:left;"></p>

      <p><button type="submit" class="btn-submit">更新</button></p>
    </form>

    <form th:action="@{/mypage}" method="get">
      <p><button type="submit" class="btn-back">◀ 戻る</button></p>
    </form>
  </main>

</body>
</html>

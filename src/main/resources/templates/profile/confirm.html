<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>確認画面</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    main {
      width: 400px;
      margin: 80px auto;
      padding: 50px 75px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 24px;
      color: #1a2a4a;
    }

    .info-block {
      text-align: left;
      margin-bottom: 20px;
    }

    .info-block p {
      font-size: 14px;
      color: #888;
      margin: 0 0 4px 0;
    }

    .info-block .value 	{
	      width: 100%;
	      font-size: 16px;
		  display: block;
	      color: #1a2a4a;
	      font-weight: bold;
	      padding: 20px;
	      background-color: #f5f5f5;
	      border-radius: 8px;
	      border: 1px solid #ccc;
	      box-sizing: border-box;
	      transition: 0.2s;
	    }

		.info-block input:focus {
		      outline: none;
		      background-color: white;
		      border: 1px solid #1a2a4a;
		      box-shadow: 0 0 5px rgba(26, 42, 74, 0.3);
		    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      display: block;
      box-sizing: border-box;
    }

    .btn-submit {
      background-color: #1a2a4a;
      color: white;
      border: none;
      margin-bottom: 10px;
    }

    .btn-submit:hover {
      background-color: #2a4a7a;
    }

    .btn-back {
      background-color: white;
      color: #1a2a4a;
      border: 1px solid #1a2a4a;
    }

    .btn-back:hover {
      background-color: #f0f4ff;
    }
  </style>
</head>
<body>

  <main>
    <h1>入力内容確認</h1>

    <div class="info-block">
      <p>名前</p>
      <span class="value" th:text="${user.name}"></span>
    </div>
    <div class="info-block">
      <p>メール</p>
      <span class="value" th:text="${user.email}"></span>
    </div>
    <div class="info-block">
      <p>住所</p>
      <span class="value" th:text="${user.address}"></span>
    </div>

    <form th:action="@{/profile/update}" method="post">
      <input type="hidden" name="id" th:value="${user.id}">
      <input type="hidden" name="name" th:value="${user.name}">
      <input type="hidden" name="email" th:value="${user.email}">
      <input type="hidden" name="address" th:value="${user.address}">
      <p><button type="submit" class="btn-submit">確定</button></p>
    </form>

    <form th:action="@{/profile/edit}" method="get">
      <p><button type="submit" class="btn-back">◀ 戻る</button></p>
    </form>
  </main>

</body>
</html>

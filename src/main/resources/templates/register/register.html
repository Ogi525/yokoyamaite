<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>新規登録</title>
  <style>
	/* ===== 共通ヘッダー・フッター ===== */
			  header { background: white; padding: 20px; border-radius: 20px; margin-bottom: 30px; }
			  .top-menu { display: flex; justify-content: space-between; align-items: center; }
			  .logo { font-size: 32px; font-weight: bold; color: #1a2a4a; }
			  .logo a { text-decoration: none; color: #1a2a4a; }
			  .nav { display: flex; gap: 20px; }
			  .nav a { text-decoration: none; color: #333; font-weight: bold; }
			  .right-area { display: flex; align-items: center; gap: 20px; }
			  .icon-box { display: flex; gap: 15px; align-items: center; }
			  .icon-btn { font-size: 26px; text-decoration: none; color: #333; transition: 0.2s; }
			  .icon-btn:hover { transform: scale(1.2); color: #1a2a4a; }
			  footer { background: white; padding: 25px; border-radius: 20px; text-align: center; }
			  footer a { text-decoration: none; color: #333; margin: 0 10px; }

    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    main {
      width: 400px;
      margin: 80px auto;
      padding: 50px 75px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
     
    }

    h1 {
      font-size: 28px;
      margin-bottom: 24px;
      color: #1a2a4a;
    }

    .info-block {
      text-align: left;
      margin-bottom: 20px;
    }

    .info-block p {
      font-size: 14px;
      color: #888;
      margin: 0 0 4px 0;
    }

    .info-block input {
      display: block;
      width: 100%;
      font-size: 16px;
      color: #1a2a4a;
      font-weight: bold;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      transition: 0.2s;
    }

    .info-block input:focus {
      outline: none;
      background-color: white;
      border: 1px solid #1a2a4a;
      box-shadow: 0 0 5px rgba(26, 42, 74, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      display: block;
      box-sizing: border-box;
    }

    .btn-submit {
      background-color: #1a2a4a;
      color: white;
      border: none;
      margin-bottom: 10px;
    }

    .btn-submit:hover {
      background-color: #2a4a7a;
    }

    .btn-back {
      background-color: white;
      color: #1a2a4a;
      border: 1px solid #1a2a4a;
    }

    .btn-back:hover {
      background-color: #f0f4ff;
    }
  </style>
</head>
<body>
  <div th:replace="~{layout/_header :: header}"></div>

  <main>
    <h1>新規登録</h1>

    <form th:action="@{/register}" th:object="${form}" method="post">
      <div class="info-block">
        <p>名前</p>
        <input type="text" th:field="*{name}" />
      </div>
      <div class="info-block">
        <p>メールアドレス</p>
        <input type="email" th:field="*{email}" />
      </div>
      <div class="info-block">
        <p>パスワード</p>
        <input type="password" th:field="*{password}" />
      </div>
      <div class="info-block">
        <p>郵便番号</p>
        <input type="text" id="postalCode" th:field="*{postalCode}"
               pattern="\d{3}-\d{4}"
               title="郵便番号をxxx-xxxxの形式で入力してください" />
      </div>
      <div class="info-block">
        <p>住所</p>
        <input type="text" th:field="*{address}" />
      </div>

      <p><button type="submit" class="btn-submit">登録</button></p>
    </form>

    <form action="/" method="get">
      <button type="submit" class="btn-back">▶ 戻る</button>
    </form>
  </main>

  <div th:replace="~{layout/_footer :: footer}"></div>
</body>
</html>

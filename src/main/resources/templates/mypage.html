<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>マイページ</title>

	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f5f5f5;
			margin: 0;
			padding: 30px;
		}

		.container {
			max-width: 1000px;
			margin: auto;
			background: white;
			border-radius: 12px;
			padding: 30px;
			box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
			display: flex;
			gap: 40px;
		}

		.profile-section {
			width: 250px;
			text-align: center;
		}

		.avatar {
			width: 180px;
			height: 180px;
			border-radius: 50%;
			background-color: #4CAF50;
			color: white;
			font-size: 72px;
			font-weight: bold;
			display: flex;
			align-items: center;
			justify-content: center;
			margin: 0 auto 20px auto;
		}

		.content-section {
			flex: 1;
		}

		h1 {
			margin-top: 0;
			color: #333;
		}

		.section {
			margin-bottom: 35px;
		}

		.info-box {
			background-color: #fafafa;
			padding: 15px;
			border-radius: 8px;
			border: 1px solid #ddd;
		}

		.info-box p {
			margin: 10px 0;
		}

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th,
		td {
			border: 1px solid #ddd;
			padding: 10px;
			text-align: center;
		}

		th {
			background-color: #4CAF50;
			color: white;
		}

		.menu a,
		.menu-button {
			display: inline-block;
			margin-right: 15px;
			text-decoration: none;
			color: white;
			background-color: #0078d4;
			padding: 10px 15px;
			border-radius: 5px;
			border: none;
			cursor: pointer;
			font-size: 14px;
		}

		.menu a:hover,
		.menu-button:hover {
			background-color: #005ea2;
		}
	</style>
</head>

<body>
	<div th:replace="~{layout/_header :: header}"></div>


	<div class="container">

		<!-- 左側 -->
		<div class="profile-section">

			<h2>プロフィール</h2>

			<div class="avatar"
			     th:text="${#strings.substring(user.name,0,1)}">
				U
			</div>

			<p th:text="${user.name}">
				ユーザー名
			</p>

		</div>

		<!-- 右側 -->
		<div class="content-section">

			<h1>マイページ</h1>

			<!-- 会員情報 -->
			<div class="section">

				<h2>会員情報</h2>

				<div class="info-box">

					<p><strong>名前：</strong> <span th:text="${user.name}">名前</span></p>
					<p><strong>メール：</strong> <span th:text="${user.email}">email</span></p>
					<p><strong>住所：</strong> <span th:text="${user.address}">address</span></p>

				</div>

			</div>

			<!-- クーポン -->
			<div class="section">

				<h2>クーポン</h2>

				<ul th:if="${coupons != null and !coupons.isEmpty()}">
					<li th:each="coupon : ${coupons}">
						<span th:text="${coupon.name}">クーポン名</span>
						
						<span th:text="${coupon.discountValue}">1000</span>
						
						（コード：
						<span th:text="${coupon.code}">CODE</span>
						）
					</li>
				</ul>

				<p th:if="${coupons == null or coupons.isEmpty()}">
					利用可能なクーポンはありません
				</p>

			</div>

			<!-- 購入履歴 -->
			<div class="section">

				<h2>購入履歴</h2>

				<table th:if="${histories != null and !histories.isEmpty()}">

						<tr>
							<th>商品名</th>
							<th>購入日</th>
							<th>金額</th>
						</tr>

						<tr th:each="history : ${histories}">

							<td th:text="${history.productName}">
								商品
							</td>

							<td th:text="${history.purchaseDate}">
								2026-01-01
							</td>

							<td>
								¥
								<span th:text="${history.price}">
									5000
								</span>
							</td>

						</tr>

					</table>
					
				<!-- 履歴がない場合 -->
					<p th:if="${histories == null or histories.isEmpty()}">
						
						購入履歴はありません
					</p>

			</div>

			<!-- メニュー -->
			<div class="menu">

				<a th:href="@{/profile/edit}">
					プロフィール編集
				</a>

				<form th:action="@{/logout}" method="post" style="display:inline;">
					<button type="submit" class="menu-button">
						ログアウト
					</button>
				</form>

			</div>

		</div>
		<div th:replace="~{layout/_footer :: footer}"></div>


	</div>

</body>

</html>

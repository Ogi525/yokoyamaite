<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>検索</title>

	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: sans-serif;
			background: #f5f5f5;
		}

		.container {
			width: 99%;
			max-width: 1600px;
			margin: 10px auto;
		}

		header {
			background: white;
			padding: 20px;
			border-radius: 20px;
			margin-bottom: 30px;
		}

		.top-menu {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.logo {
			font-size: 32px;
			font-weight: bold;
			color: #1a2a4a;
		}

		.logo a {
			text-decoration: none;
			color: #1a2a4a;
		}

		.nav {
			display: flex;
			gap: 20px;
		}

		.nav a {
			text-decoration: none;
			color: #333;
			font-weight: bold;
		}

		.right-area {
			display: flex;
			align-items: center;
			gap: 20px;
		}

		.icon-box {
			display: flex;
			gap: 15px;
			align-items: center;
		}

		.icon-btn {
			font-size: 26px;
			text-decoration: none;
			color: #333;
			transition: 0.2s;
		}

		.icon-btn:hover {
			transform: scale(1.2);
			color: #1a2a4a;
		}

		.search-wrapper {
			display: flex;
			justify-content: center;
		}

		.search-box {
			width: 100%;
			max-width: 1100px;
			background: white;
			padding: 25px;
			border-radius: 25px;
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
			border: 3px solid #8fa8c8;
			margin-bottom: 40px;
		}

		.search-title {
			font-size: 35px;
			font-weight: bold;
			color: #1a2a4a;
			margin-bottom: 30px;
			border-left: 10px solid #1a2a4a;
			padding-left: 15px;
		}

		.section {
			margin-bottom: 30px;
		}

		.section-title {
			font-size: 20px;
			font-weight: bold;
			margin-bottom: 15px;
			color: #1a2a4a;
		}

		label {
			display: block;
			margin-bottom: 10px;
			font-size: 16px;
		}

		input[type="text"],
		input[type="number"],
		select {
			width: 100%;
			padding: 12px;
			border-radius: 12px;
			border: 1px solid #ccc;
			box-sizing: border-box;
			font-size: 15px;
			transition: 0.2s;
		}

		input[type="text"]:focus,
		input[type="number"]:focus,
		select:focus {
			outline: none;
			border: 1px solid #1a2a4a;
			box-shadow: 0 0 5px rgba(26, 42, 74, 0.3);
		}

		input[type="checkbox"] {
			margin-right: 8px;
			transform: scale(1.1);
		}

		.price-area {
			display: flex;
			gap: 15px;
		}

		button {
			width: 100%;
			padding: 15px;
			border: none;
			border-radius: 15px;
			background: #1a2a4a;
			color: white;
			font-size: 18px;
			font-weight: bold;
			cursor: pointer;
			transition: 0.3s;
		}

		button:hover {
			background: #2a4a7a;
			transform: translateY(-2px);
			box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
		}

		footer {
			background: white;
			padding: 25px;
			border-radius: 20px;
			text-align: center;
		}

		footer a {
			text-decoration: none;
			color: #333;
			margin: 0 10px;
		}

		@media screen and (max-width:768px) {
			.search-box {
				width: 100%;
				padding: 25px;
			}
			.search-title {
				font-size: 28px;
			}
		}

		.checkbox-group {
			display: flex;
			flex-wrap: wrap;
			gap: 12px 20px;
		}

		.checkbox-group label {
			display: flex;
			align-items: center;
			margin-bottom: 0;
			min-width: 110px;
		}
	</style>

</head>

<body>

	<div class="container">

		<div th:replace="~{layout/_header :: header}"></div>

		<div class="search-wrapper">

			<form th:action="@{/searchresult}" method="get">

				<div class="search-box">

					<div class="search-title">
						商品検索
					</div>

					<div class="section">
						<div class="section-title">キーワード検索</div>
						<input type="text" name="keyword" placeholder="商品名・説明文など">
					</div>

					<div class="section">
						<div class="section-title">エリア</div>
						<div class="checkbox-group">
							<label><input type="checkbox" name="areas" value="1">道東</label>
							<label><input type="checkbox" name="areas" value="2">道央</label>
							<label><input type="checkbox" name="areas" value="3">道南</label>
							<label><input type="checkbox" name="areas" value="4">道北</label>
						</div>
					</div>

					<div class="section">
						<div class="section-title">カテゴリー</div>
						<div class="checkbox-group">
							<label><input type="checkbox" name="categories" value="1">肉</label>
							<label><input type="checkbox" name="categories" value="2">海鮮</label>
							<label><input type="checkbox" name="categories" value="3">野菜</label>
							<label><input type="checkbox" name="categories" value="4">飲料</label>
							<label><input type="checkbox" name="categories" value="5">お酒</label>
							<label><input type="checkbox" name="categories" value="6">菓子類</label>
						</div>
					</div>

					<div class="section">
						<div class="section-title">価格帯</div>
						<div class="price-area">
							<input type="number" name="minPrice" placeholder="最低価格" min="0" step="500">
							<input type="number" name="maxPrice" placeholder="最高価格" min="0" step="500">
						</div>
					</div>

					<div class="section">
						<div class="section-title">並べ替え</div>
						<select name="sort">
							<option value="">標準</option>
							<option value="newest">更新順</option>
							<option value="priceDesc">金額が高い順</option>
							<option value="priceAsc">金額が低い順</option>
							<option value="popular">人気順</option>
						</select>
					</div>

					<button type="submit">
						検索する
					</button>

				</div>

			</form>

		</div>

		<div th:replace="~{layout/_footer :: footer}"></div>

	</div>

</body>

</html>

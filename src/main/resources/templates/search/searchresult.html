<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>横山蒸留所</title>

	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: sans-serif;
			background: #f5f5f5;
		}

		.container {
			width: 95%;
			max-width: 1400px;
			margin: 25px auto;
		}

		header {
			background: white;
			padding: 20px;
			border-radius: 20px;
			margin-bottom: 30px;
		}

		.top-menu {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.logo {
			font-size: 32px;
			font-weight: bold;
			color: #1a2a4a;
		}

		.logo a {
			text-decoration: none;
			color: #1a2a4a;
		}

		.nav {
			display: flex;
			gap: 20px;
		}

		.nav a {
			text-decoration: none;
			color: #333;
			font-weight: bold;
		}

		.right-area {
			display: flex;
			align-items: center;
			gap: 20px;
		}

		.icon-box {
			display: flex;
			gap: 15px;
			align-items: center;
		}

		.icon-btn {
			font-size: 26px;
			text-decoration: none;
			color: #333;
			transition: 0.2s;
		}

		.icon-btn:hover {
			transform: scale(1.2);
			color: #1a2a4a;
		}

		.search-wrapper {
			display: flex;
			justify-content: center;
		}

		.search-box {
			width: 100%;
			max-width: 1100px;
			background: white;
			padding: 25px;
			border-radius: 25px;
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
			border: 3px solid #8fa8c8;
		}

		.page-title {
			font-size: 36px;
			font-weight: bold;
			margin-bottom: 25px;
			border-left: 10px solid #1a2a4a;
			padding-left: 15px;
			color: #1a2a4a;
		}

		.search-info {
			background: white;
			padding: 20px;
			border-radius: 20px;
			margin-bottom: 25px;
			box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
		}

		.search-info a {
			text-decoration: none;
			color: #1a2a4a;
			font-weight: bold;
		}

		.result-count {
			margin-top: 15px;
			font-size: 18px;
			font-weight: bold;
		}

		.product-list {
			display: flex;
			flex-wrap: wrap;
			gap: 20px;
			justify-content: flex-start;
		}

		.product-card {
			width: calc((100% - 80px) / 5);
			background: white;
			border-radius: 24px;
			overflow: hidden;
			border: 3px solid #8fa8c8;
			transition: 0.3s;
			box-shadow: 0 5px 10px rgba(0, 0, 0, 0.08);
			box-sizing: border-box;
		}

		.product-card:hover {
			transform: translateY(-8px);
			box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
		}

		.card-image {
			width: 100%;
			height: 160px;
			overflow: hidden;
		}

		.card-image img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.card-body {
			padding: 15px;
		}

		.card-name {
			font-size: 20px;
			font-weight: bold;
			margin-bottom: 12px;
		}

		.card-info {
			font-size: 14px;
			color: #666;
			margin-bottom: 6px;
		}

		.card-price {
			font-size: 22px;
			color: #1a2a4a;
			font-weight: bold;
			margin-top: 12px;
		}

		.empty-box {
			background: white;
			padding: 40px;
			border-radius: 20px;
			text-align: center;
			font-size: 20px;
			box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
		}

		footer {
			background: white;
			padding: 25px;
			border-radius: 20px;
			text-align: center;
			margin-top: 50px;
		}

		footer a {
			text-decoration: none;
			color: #333;
			margin: 0 10px;
		}

		@media screen and (max-width:768px) {
			.top-menu {
				flex-direction: column;
			}
			.nav {
				flex-wrap: wrap;
				justify-content: center;
			}
			.product-list {
				justify-content: center;
			}
			.product-card {
				width: 100%;
				max-width: 320px;
			}
		}
	</style>

</head>

<body>

	<div class="container">

		<div th:replace="~{layout/_header :: header}"></div>

		<h1 class="page-title">
			検索結果
		</h1>

		<div class="search-info">
			<div class="search-info">
				<div style="display:flex;
		                justify-content:space-between;
		                align-items:center;
		                flex-wrap:wrap;
		                gap:15px;">

					<a th:href="@{/search}">
						← 検索画面へ戻る
					</a>

					<form th:action="@{/searchresult}" method="get">

						<input type="hidden" name="keyword" th:value="${param.keyword}">
						<input type="hidden" name="minPrice" th:value="${param.minPrice}">
						<input type="hidden" name="maxPrice" th:value="${param.maxPrice}">

						<th:block th:each="a : ${param.areas}">
							<input type="hidden" name="areas" th:value="${a}">
						</th:block>

						<th:block th:each="c : ${param.categories}">
							<input type="hidden" name="categories" th:value="${c}">
						</th:block>

						<select name="sort" onchange="this.form.submit()" style="
		                        padding:10px 15px;
		                        border-radius:10px;
		                        border:1px solid #ccc;
		                        font-size:15px;
		                    ">
							<option value="">並べ替え</option>
							<option value="priceAsc" th:selected="${param.sort == 'priceAsc'}">価格が安い順</option>
							<option value="priceDesc" th:selected="${param.sort == 'priceDesc'}">価格が高い順</option>
							<option value="new" th:selected="${param.sort == 'new'}">新着順</option>
						</select>

					</form>

				</div>

				<div class="result-count" th:unless="${#lists.isEmpty(products)}">
					検索結果：
					<span th:text="${#lists.size(products)}"></span>
					件
				</div>

			</div>
		</div>

		<div class="empty-box" th:if="${#lists.isEmpty(products)}">
			該当する商品がありませんでした。
		</div>

		<div class="product-list" th:unless="${#lists.isEmpty(products)}">

			<a class="product-card"
			   th:each="product : ${products}"
			   th:href="@{/item/{id}(id=${product.id})}"
			   style="text-decoration:none; color:inherit; display:block;">

				<div class="card-image">
					<img th:src="${product.imageUrl}" th:alt="${product.name}">
				</div>

				<div class="card-body">
					<div class="card-name" th:text="${product.name}"></div>
					<div class="card-info">エリア：<span th:text="${product.areaId}"></span></div>
					<div class="card-info">カテゴリー：<span th:text="${product.categoryId}"></span></div>
					<div class="card-price">¥<span th:text="${product.price}"></span></div>
				</div>

			</a>

		</div>

		<div th:replace="~{layout/_footer :: footer}"></div>

	</div>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>検索結果</title>

<style>

body{
    font-family: sans-serif;
    margin: 30px;
}

.product{
    border: 1px solid #ccc;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 8px;
}

.price{
    color: red;
    font-weight: bold;
}

.search-info{
    margin-bottom: 20px;
}

</style>

</head>
<body>

<h1>検索結果</h1>

<div class="search-info">

    <a th:href="@{/search}">
        検索画面へ戻る
    </a>

</div>

<!-- 商品が0件 -->

<div th:if="${#lists.isEmpty(products)}">

    <p>該当する商品がありませんでした。</p>

</div>

<!-- 商品一覧 -->

<div th:unless="${#lists.isEmpty(products)}">

    <p>
        検索結果：
        <span th:text="${#lists.size(products)}"></span>
        件
    </p>

    <div class="product" th:each="product : ${products}">

        <h2 th:text="${product.name}"></h2>

        <p>
            エリア：
            <span th:text="${product.areaId}"></span>
        </p>

        <p>
            カテゴリー：
            <span th:text="${product.categoryId}"></span>
        </p>

        <p class="price">
            <span th:text="${product.price}"></span> 円
        </p>

    </div>

</div>

</body>
</html>

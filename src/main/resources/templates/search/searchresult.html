<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>検索結果</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:sans-serif;
    background:#f5f5f5;
}

/* =========================
   全体
========================= */

.container{
    width:95%;
    max-width:1400px;
    margin:25px auto;
}

/* =========================
   ヘッダー
========================= */

header{
    background:white;
    padding:20px;
    border-radius:20px;
    margin-bottom:30px;
    box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

.top-menu{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#005b96;
}

.nav{
    display:flex;
    gap:20px;
}

.nav a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
}

.right-area{
    display:flex;
    align-items:center;
    gap:20px;
}

.search-box input{
    padding:10px 15px;
    border-radius:10px;
    border:1px solid #ccc;
    width:220px;
}

.icon-box{
    display:flex;
    gap:15px;
}

.icon-btn{
    font-size:24px;
    text-decoration:none;
    color:#333;
}

/* =========================
   タイトル
========================= */

.page-title{

    font-size:36px;
    font-weight:bold;

    margin-bottom:25px;

    border-left:10px solid #005b96;

    padding-left:15px;

    color:#005b96;
}

/* =========================
   検索情報
========================= */

.search-info{

    background:white;

    padding:20px;

    border-radius:20px;

    margin-bottom:25px;

    box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

.search-info a{

    text-decoration:none;

    color:#005b96;

    font-weight:bold;
}

.result-count{
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
}

.product-list{

    display:flex;

    flex-wrap:wrap;

    gap:20px;

    justify-content:flex-start;
}

/* 商品カード */

.product-card{

    width:calc((100% - 80px) / 5);

    background:white;

    border-radius:24px;

    overflow:hidden;

    border:3px solid #b7d8ef;

    transition:0.3s;

    box-shadow:
        0 5px 10px rgba(0,0,0,0.08);

    box-sizing:border-box;
}

.product-card:hover{

    transform:translateY(-8px);

    box-shadow:
        0 10px 20px rgba(0,0,0,0.15);
}

.card-image{

    width:100%;
    height:160px;

    overflow:hidden;
}

.card-image img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.card-body{
    padding:15px;
}

.card-name{

    font-size:20px;

    font-weight:bold;

    margin-bottom:12px;
}

.card-info{

    font-size:14px;

    color:#666;

    margin-bottom:6px;
}

.card-price{

    font-size:22px;

    color:#005b96;

    font-weight:bold;

    margin-top:12px;
}

/* =========================
   商品なし
========================= */

.empty-box{

    background:white;

    padding:40px;

    border-radius:20px;

    text-align:center;

    font-size:20px;

    box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

/* =========================
   フッター
========================= */

footer{

    background:white;

    padding:25px;

    border-radius:20px;

    text-align:center;

    margin-top:50px;
}

footer a{
    text-decoration:none;
    color:#333;
    margin:0 10px;
}

/* =========================
   レスポンシブ
========================= */

@media screen and (max-width:768px){

    .top-menu{
        flex-direction:column;
    }

    .nav{
        flex-wrap:wrap;
        justify-content:center;
    }

    .product-list{
        justify-content:center;
    }

    .product-card{
        width:100%;
        max-width:320px;
    }
}

</style>

</head>

<body>

<div class="container">

    <!-- ヘッダー -->
    <header>

        <div class="top-menu">

            <div class="logo">
                横山蒸留所
            </div>

            <nav class="nav">
                <a href="#">カテゴリー</a>
                <a href="#">絞り込み</a>
                <a href="#">ミニゲーム</a>
                <a href="#">所持クーポン</a>
            </nav>

            <div class="right-area">

                <div class="search-box">
                    <input type="text" placeholder="検索">
                </div>

                <div class="icon-box">

                    <a href="/cart" class="icon-btn">
                        🛒
                    </a>

                    <a href="/mypage" class="icon-btn">
                        👤
                    </a>

                </div>

            </div>

        </div>

    </header>

    <!-- タイトル -->
    <h1 class="page-title">
        検索結果
    </h1>

    <!-- 検索情報 -->
    <div class="search-info">

		<div class="search-info">

		    <div style="display:flex;
		                justify-content:space-between;
		                align-items:center;
		                flex-wrap:wrap;
		                gap:15px;">

		        <a th:href="@{/search}">
		            ← 検索画面へ戻る
		        </a>

		        <!-- 並べ替え -->
		        <form th:action="@{/searchresult}" method="get">

		            <!-- 検索条件を保持 -->
		            <input type="hidden" name="keyword" th:value="${param.keyword}">
		            <input type="hidden" name="minPrice" th:value="${param.minPrice}">
		            <input type="hidden" name="maxPrice" th:value="${param.maxPrice}">

		            <!-- area -->
		            <th:block th:each="a : ${param.areas}">
		                <input type="hidden" name="areas" th:value="${a}">
		            </th:block>

		            <!-- category -->
		            <th:block th:each="c : ${param.categories}">
		                <input type="hidden" name="categories" th:value="${c}">
		            </th:block>

		            <select name="sort"
		                    onchange="this.form.submit()"
		                    style="
		                        padding:10px 15px;
		                        border-radius:10px;
		                        border:1px solid #ccc;
		                        font-size:15px;
		                    ">

		                <option value="">
		                    並べ替え
		                </option>

		                <option value="priceAsc"
		                        th:selected="${param.sort == 'priceAsc'}">
		                    価格が安い順
		                </option>

		                <option value="priceDesc"
		                        th:selected="${param.sort == 'priceDesc'}">
		                    価格が高い順
		                </option>

		                <option value="new"
		                        th:selected="${param.sort == 'new'}">
		                    新着順
		                </option>

		            </select>

		        </form>

		    </div>

		    <div class="result-count"
		         th:unless="${#lists.isEmpty(products)}">

		        検索結果：
		        <span th:text="${#lists.size(products)}"></span>
		        件

		    </div>

		</div>
		

    </div>

    <!-- 商品0件 -->

    <div class="empty-box"
         th:if="${#lists.isEmpty(products)}">

        該当する商品がありませんでした。

    </div>

    <!-- 商品一覧 -->

    <div class="product-list"
         th:unless="${#lists.isEmpty(products)}">

        <div class="product-card"
             th:each="product : ${products}">

            <!-- 商品画像 -->
            <div class="card-image">

                <img th:src="${product.imageUrl}"
                     th:alt="${product.name}">

            </div>

            <!-- 商品情報 -->
            <div class="card-body">

                <div class="card-name"
                     th:text="${product.name}">
                </div>

                <div class="card-info">
                    エリア：
                    <span th:text="${product.areaId}"></span>
                </div>

                <div class="card-info">
                    カテゴリー：
                    <span th:text="${product.categoryId}"></span>
                </div>

                <div class="card-price">
                    ¥<span th:text="${product.price}"></span>
                </div>

            </div>

        </div>

    </div>

    <!-- フッター -->
    <footer>

        <a href="#">お問い合わせ</a>
        |
        <a href="#">利用規約</a>
        |
        <a href="#">プライバシーポリシー</a>
        |
        <a href="#">配送について</a>
        |
        <a href="#">FAQ</a>

    </footer>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>ログイン</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    main {
      width: 400px;
      margin: 80px auto;
      padding: 75px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #1a2a4a;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      transition: 0.2s;
    }

    input:focus {
      outline: none;
      border: 1px solid #1a2a4a;
      box-shadow: 0 0 5px rgba(26, 42, 74, 0.3);
    }

    button {
      width: 106%;
      padding: 12px;
      font-size: 16px;
      background-color: #1a2a4a;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #2a4a7a;
    }

    a {
      display: inline-block;
      margin-top: 15px;
      color: #1a2a4a;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <main>
    <h1>ログイン</h1>
    <p th:if="${loginError}" style="color:red">[[${loginError}]]</p>

    <form th:action="@{/login}" th:object="${form}" method="post">
      <p>
        メールアドレス<input type="email" th:field="*{email}" />
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
      </p>
      <p>
        パスワード<input type="password" th:field="*{password}" />
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
      </p>

      <p><button type="submit">ログイン</button></p>
    </form>

    <p><a href="/register">▶ 新規会員登録はこちら</a></p>
  </main>

</body>
</html>

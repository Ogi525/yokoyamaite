<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>横山販売所</title>

	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: sans-serif;
			background: #f5f5f5;
		}

		.container {
			width: 95%;
			max-width: 1400px;
			margin: 30px auto;
		}

		header {
			background: white;
			padding: 20px;
			border-radius: 20px;
			margin-bottom: 30px;
		}

		.top-menu {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.logo {
			font-size: 32px;
			font-weight: bold;
			color: #1a2a4a;
		}

		.logo a {
			text-decoration: none;
			color: #1a2a4a;
		}

		.nav {
			display: flex;
			gap: 20px;
		}

		.nav a {
			text-decoration: none;
			color: #333;
			font-weight: bold;
		}

		.right-area {
			display: flex;
			align-items: center;
			gap: 20px;
		}

		.icon-box {
			display: flex;
			gap: 15px;
			align-items: center;
		}

		.icon-btn {
			font-size: 26px;
			text-decoration: none;
			color: #333;
			transition: 0.2s;
		}

		.icon-btn:hover {
			transform: scale(1.2);
			color: #1a2a4a;
		}

		/* =========================
		   回転寿司レーン
		========================= */

		.sushi-lane {
			background: #ececec;
			padding: 40px 0;
			border-radius: 25px;
			overflow: hidden;
			margin-bottom: 50px;
		}

		.lane-title {
			text-align: center;
			font-size: 35px;
			font-weight: bold;
			margin-bottom: 40px;
		}

		.lane-wrapper {
			overflow: hidden;
			width: 100%;
		}

		.lane-track {
			display: flex;
			align-items: flex-end;
			gap: 50px;
			width: max-content;
			animation: sushiLoop 25s linear infinite;
		}

		.lane-track:hover {
			animation-play-state: paused;
		}

		.lane-item {
			display: block;
			width: 220px;
			flex-shrink: 0;
			text-align: center;
			position: relative;
			padding-top: 60px;
			text-decoration: none;
			color: inherit;
		}

		/* お皿（楕円の外枠） */
		.lane-item::before {
			content: "";
			position: absolute;
			bottom: 0;
			left: 50%;
			transform: translateX(-50%);
			width: 190px;
			height: 50px;
			background: linear-gradient(to bottom, #ffffff, #d9d9d9);
			border-radius: 50%;
			border: 8px solid #1a2a4a;
			z-index: 1;
			box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
		}

		/* お皿（内側の楕円） */
		.lane-item::after {
			content: "";
			position: absolute;
			bottom: 13px;
			left: 50%;
			transform: translateX(-50%);
			width: 160px;
			height: 22px;
			border-radius: 60%;
			border: 5px solid #1a2a4a;
			z-index: 1;
		}

		/* 通常商品画像：四角・回転なし */
		.lane-item img {
			width: 140px;
			height: 140px;
			border-radius: 8px;
			object-fit: cover;
			border: 6px solid white;
			background: white;
			position: relative;
			z-index: 2;
			transition: transform 0.3s;
			margin-bottom: 5px;
		}

		.lane-item img:hover {
			transform: scale(1.1);
		}

		.lane-item p {
			margin: 0 0 10px;
			font-size: 20px;
			font-weight: bold;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			width: 100%;
			box-sizing: border-box;
			padding: 0 8px;
		}

		/* =========================
		   SSR金ぴか魚
		========================= */

		.gold-fish {
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		/* 金ぴか魚のお皿を金色に上書き */
		.gold-fish::before {
			border: 8px solid gold;
		}

		.gold-fish::after {
			border: 5px solid gold;
		}

		/* 金ぴか魚アイコン：円形・回転あり */
		.gold-fish-icon {
			width: 140px;
			height: 140px;
			border-radius: 50%;
			border: 6px solid gold;
			box-shadow: 0 0 12px 4px gold;
			background-color: white;
			background-image: url('/images/gold-rin.png');
			background-size: contain;
			background-repeat: no-repeat;
			background-position: center center;
			position: relative;
			z-index: 2;
			animation: rotateSushi 8s linear infinite;
			transition: transform 0.3s;
			margin: 0 auto 5px;
			display: block;
			flex-shrink: 0;
			box-sizing: border-box;
		}

		.gold-fish-icon:hover {
			transform: scale(1.1);
		}

		/* =========================
		   カード型商品一覧
		========================= */

		.section {
			margin-bottom: 60px;
		}

		.section-title {
			font-size: 35px;
			font-weight: bold;
			margin-bottom: 25px;
			border-left: 10px solid #1a2a4a;
			padding-left: 15px;
			color: #1a2a4a;
		}

		.product-list {
			display: flex;
			gap: 20px;
			flex-wrap: wrap;
			justify-content: flex-start;
		}

		.product-card {
			width: calc((100% - 80px) / 5);
			background: white;
			border-radius: 24px;
			overflow: hidden;
			border: 3px solid #8fa8c8;
			transition: 0.3s;
			box-shadow: 0 5px 10px rgba(0, 0, 0, 0.08);
			box-sizing: border-box;
			flex-shrink: 0;
		}

		.product-card:hover {
			transform: translateY(-8px);
			box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
		}

		.card-image {
			width: 100%;
			height: 160px;
			overflow: hidden;
		}

		.card-image img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.card-body {
			padding: 15px;
		}

		.card-name {
			font-size: 20px;
			font-weight: bold;
			margin-bottom: 12px;
		}

		.card-info {
			font-size: 14px;
			color: #666;
			margin-bottom: 6px;
		}

		.card-price {
			font-size: 22px;
			color: #1a2a4a;
			font-weight: bold;
			margin-top: 12px;
		}

		/* =========================
		   フッター
		========================= */

		footer {
			background: white;
			padding: 25px;
			border-radius: 20px;
			text-align: center;
		}

		footer a {
			text-decoration: none;
			color: #333;
			margin: 0 10px;
		}

		/* =========================
		   アニメーション
		========================= */

		@keyframes sushiLoop {
			from { transform: translateX(0); }
			to { transform: translateX(-50%); }
		}

		@keyframes rotateSushi {
			from { transform: rotate(0deg); }
			to { transform: rotate(360deg); }
		}

		/* =========================
		   レスポンシブ
		========================= */

		@media screen and (max-width: 768px) {
			.top-menu {
				flex-direction: column;
				gap: 20px;
			}
			.nav {
				flex-wrap: wrap;
				justify-content: center;
			}
			.product-list {
				justify-content: center;
			}
			.product-card {
				width: 100%;
				max-width: 320px;
			}
			.lane-title {
				font-size: 40px;
			}
		}
	</style>

</head>

<body>

	<div class="container">

		<div th:replace="~{layout/_header :: header}"></div>

		<!-- 回転寿司レーン -->
		<div class="sushi-lane">

			<div class="lane-title">
				おすすめ商品
			</div>

			<div class="lane-wrapper">
				<div class="lane-track">

					<!-- 1周目 -->
					<a th:each="product : ${recommendProducts}"
					   th:href="@{/item/{id}(id=${product.id})}"
					   class="lane-item">
						<p th:text="${product.name}"></p>
						<img th:src="${product.imageUrl}" th:alt="${product.name}">
					</a>

					<!-- SSR金ぴか魚 -->
					<div class="lane-item gold-fish">
						<p>✨金のりんざらし✨</p>
						<div class="gold-fish-icon"></div>
					</div>

					<!-- 2周目 -->
					<a th:each="product : ${recommendProducts}"
					   th:href="@{/item/{id}(id=${product.id})}"
					   class="lane-item">
						<p th:text="${product.name}"></p>
						<img th:src="${product.imageUrl}" th:alt="${product.name}">
					</a>

					<!-- SSR金ぴか魚 -->
					<div class="lane-item gold-fish">
						<p>✨金のりんざらし✨</p>
						<div class="gold-fish-icon"></div>
					</div>

				</div>
			</div>

		</div>

		<!-- 新着商品 -->
		<section class="section">

			<h2 class="section-title">新着商品</h2>

			<div class="product-list">
				<a class="product-card"
				   th:each="product : ${newProducts}"
				   th:href="@{/item/{id}(id=${product.id})}"
				   style="text-decoration:none; color:inherit; display:block;">
					<div class="card-image">
						<img th:src="${product.imageUrl}" th:alt="${product.name}">
					</div>
					<div class="card-body">
						<div class="card-name" th:text="${product.name}"></div>
						<div class="card-info">エリア：
							<span th:switch="${product.areaId}">
								<span th:case="1">道南</span>
								<span th:case="2">道北</span>
								<span th:case="3">道央</span>
								<span th:case="4">道東</span>
								<span th:case="*" th:text="${product.areaId}"></span>
							</span>
						</div>
						<div class="card-info">カテゴリー：
							<span th:switch="${product.categoryId}">
								<span th:case="1">肉</span>
								<span th:case="2">海鮮</span>
								<span th:case="3">野菜</span>
								<span th:case="4">お菓子</span>
								<span th:case="5">飲料水</span>
								<span th:case="6">お酒</span>
								<span th:case="*" th:text="${product.categoryId}"></span>
							</span>
						</div>
						<div class="card-price">¥<span th:text="${product.price}"></span></div>
					</div>
				</a>
			</div>

		</section>

		<!-- ランキング -->
		<section class="section">

			<h2 class="section-title">売れ筋ランキング</h2>

			<div class="product-list">
				<a class="product-card"
				   th:each="product : ${rankingProducts}"
				   th:href="@{/item/{id}(id=${product.id})}"
				   style="text-decoration:none; color:inherit; display:block;">
					<div class="card-image">
						<img th:src="${product.imageUrl}" th:alt="${product.name}">
					</div>
					<div class="card-body">
						<div class="card-name" th:text="${product.name}"></div>
						<div class="card-info">エリア：
							<span th:switch="${product.areaId}">
								<span th:case="1">道南</span>
								<span th:case="2">道北</span>
								<span th:case="3">道央</span>
								<span th:case="4">道東</span>
								<span th:case="*" th:text="${product.areaId}"></span>
							</span>
						</div>
						<div class="card-info">カテゴリー：
							<span th:switch="${product.categoryId}">
								<span th:case="1">肉</span>
								<span th:case="2">海鮮</span>
								<span th:case="3">野菜</span>
								<span th:case="4">お菓子</span>
								<span th:case="5">飲料水</span>
								<span th:case="6">お酒</span>
								<span th:case="*" th:text="${product.categoryId}"></span>
							</span>
						</div>
						<div class="card-price">¥<span th:text="${product.price}"></span></div>
					</div>
				</a>
			</div>

		</section>

		<div th:replace="~{layout/_footer :: footer}"></div>

	</div>

</body>

</html>

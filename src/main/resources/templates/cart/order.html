<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>注文確認 | 横山販売所</title>

	<style>
		/* ===== 共通ヘッダー・フッター ===== */
				  header { background: white; padding: 20px; border-radius: 20px; margin-bottom: 30px;		width: 100%;
			box-sizing: border-box; }
				  .top-menu { display: flex; justify-content: space-between; align-items: center; }
				  .logo { font-size: 32px; font-weight: bold; color: #1a2a4a; }
				  .logo a { text-decoration: none; color: #1a2a4a; }
				  .nav { display: flex; gap: 20px; }
				  .nav a { text-decoration: none; color: #333; font-weight: bold; }
				  .right-area { display: flex; align-items: center; gap: 20px; }
				  .icon-box { display: flex; gap: 15px; align-items: center; }
				  .icon-btn { font-size: 26px; text-decoration: none; color: #333; transition: 0.2s; }
				  .icon-btn:hover { transform: scale(1.2); color: #1a2a4a; }
				  footer { background: white; padding: 25px; border-radius: 20px; text-align: center; }
				  footer a { text-decoration: none; color: #333; margin: 0 10px; }

				  /* ===== 以下、既存のitem.html用スタイル ===== */
		body {
			margin: 0;
			padding: 0;
			background: #f5f5f5;
			font-family: sans-serif;
			color: #333;
		}

		.container {
			width: 95%;
			max-width: 1200px;
			margin: 30px auto;
		}


		.confirm-wrapper {
			background: white;
			border-radius: 28px;
			padding: 45px;
			border: 3px solid #dbe4ef;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);

			max-width: 950px;
			margin: 0 auto;
		}

		.page-title {
			font-size: 40px;
			font-weight: bold;
			color: #1a2a4a;
			margin-bottom: 40px;
			border-left: 10px solid #1a2a4a;
			padding-left: 18px;
		}

		.section {
			margin-bottom: 35px;
		}

		.section-label {
			font-size: 22px;
			font-weight: bold;
			color: #1a2a4a;
			margin-bottom: 15px;
		}

		.value-box {
			background: #f8fafc;
			border: 2px solid #dbe4ef;
			border-radius: 18px;
			padding: 22px;
			line-height: 1.8;
			font-size: 17px;
		}

		.summary {
			margin-top: 45px;
			background: #f8fafc;
			border: 2px solid #dbe4ef;
			border-radius: 22px;
			padding: 30px;
		}

		.summary-title {
			font-size: 28px;
			font-weight: bold;
			color: #1a2a4a;
			margin-bottom: 30px;
		}

		.summary-row {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 18px;
			font-size: 18px;
		}

		.total {
			margin-top: 25px;
			padding-top: 25px;
			border-top: 2px solid #d6dce5;
			font-size: 30px;
			font-weight: bold;
			color: #1a2a4a;
		}

		.button-area {
			margin-top: 40px;
			display: flex;
			gap: 20px;
			flex-wrap: wrap;
		}

		.btn {
			flex: 1;
			padding: 18px;
			border: none;
			border-radius: 16px;
			font-size: 18px;
			font-weight: bold;
			cursor: pointer;
			text-decoration: none;
			text-align: center;
			transition: 0.25s;
		}

		.back-btn {
			background: #dfe5ec;
			color: #333;
		}

		.back-btn:hover {
			background: #cfd7e0;
			transform: translateY(-2px);
		}

		.complete-btn {
			background: #1a2a4a;
			color: white;
		}

		.complete-btn:hover {
			background: #2a3d63;
			transform: translateY(-2px);
		}

		@media screen and (max-width: 768px) {

			.confirm-wrapper {
				padding: 25px;
			}

			.page-title {
				font-size: 30px;
			}

			.section-label {
				font-size: 20px;
			}

			.total {
				font-size: 24px;
			}

			.button-area {
				flex-direction: column;
			}
		}
	</style>

</head>

<body>

	<div class="container">

		<div th:replace="~{layout/_header :: header}"></div>

		<div class="confirm-wrapper">

			<h1 class="page-title">
				注文確認
			</h1>

			<!-- 支払い方法 -->
			<div class="section">

				<div class="section-label">
					支払い方法
				</div>

				<div class="value-box"
					 th:text="${paymentMethod}">
				</div>

			</div>

			<!-- 配送先 -->
			<div class="section">

				<div class="section-label">
					配送先
				</div>

				<div class="value-box"
					 th:if="${deliveryType == 'home'}">

					ご自宅へ配送

				</div>

				<div class="value-box"
					 th:if="${deliveryType == 'other'}">

					<div>
						〒<span th:text="${postalCode}"></span>
					</div>

					<div th:text="${otherAddress}"></div>

					<div th:text="${otherName}"></div>

				</div>

			</div>

			<!-- 注文概要 -->
			<div class="summary">

				<div class="summary-title">
					注文概要
				</div>

				<div class="summary-row">

					<span>商品合計</span>

					<span>
						¥<span th:text="${#numbers.formatInteger(totalPrice, 3, 'COMMA')}"></span>
					</span>

				</div>

				<div class="summary-row">

					<span>クーポン割引</span>

					<span>
						-¥<span th:text="${#numbers.formatInteger(discountAmount, 3, 'COMMA')}"></span>
					</span>

				</div>

				<div class="summary-row">

					<span>送料</span>

					<span>
						¥<span th:text="${#numbers.formatInteger(shippingFee, 3, 'COMMA')}"></span>
					</span>

				</div>

				<div class="summary-row total">

					<span>合計金額</span>

					<span>
						¥<span th:text="${#numbers.formatInteger(finalPrice, 3, 'COMMA')}"></span>
					</span>

				</div>

			</div>

			<!-- ボタン -->
			<div class="button-area">

				<a th:href="@{/checkout}"
				   class="btn back-btn">

					入力画面へ戻る

				</a>

				<form th:action="@{/cart/complete}"
					  method="post"
					  style="flex:1; margin:0;">

					<input type="hidden"
						   name="couponId"
						   th:value="${couponId}">

					<button type="submit"
							class="btn complete-btn"
							style="width:100%;">

						注文を確定する

					</button>

				</form>

			</div>

		</div>

		<div th:replace="~{layout/_footer :: footer}"></div>

	</div>

</body>

</html>

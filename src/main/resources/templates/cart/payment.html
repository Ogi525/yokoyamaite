<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>決済 | 横山販売所</title>

	<style>
		/* ===== 共通ヘッダー・フッター ===== */
				  header { background: white; padding: 20px; border-radius: 20px; margin-bottom: 30px; }
				  .top-menu { display: flex; justify-content: space-between; align-items: center; }
				  .logo { font-size: 32px; font-weight: bold; color: #1a2a4a; }
				  .logo a { text-decoration: none; color: #1a2a4a; }
				  .nav { display: flex; gap: 20px; }
				  .nav a { text-decoration: none; color: #333; font-weight: bold; }
				  .right-area { display: flex; align-items: center; gap: 20px; }
				  .icon-box { display: flex; gap: 15px; align-items: center; }
				  .icon-btn { font-size: 26px; text-decoration: none; color: #333; transition: 0.2s; }
				  .icon-btn:hover { transform: scale(1.2); color: #1a2a4a; }
				  footer { background: white; padding: 25px; border-radius: 20px; text-align: center; }
				  footer a { text-decoration: none; color: #333; margin: 0 10px; }

				  /* ===== 以下、既存のitem.html用スタイル ===== */
		body {
			margin: 0;
			padding: 0;
			font-family: sans-serif;
			background: #f5f5f5;
			color: #333;
		}

		.container {
			width: 95%;
			max-width: 1200px;
			margin: 30px auto;
		}

		/* =========================
		   メインカード
		========================= */

		.payment-wrapper {
			background: white;
			border-radius: 25px;
			padding: 40px;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
		}

		.page-title {
			font-size: 40px;
			font-weight: bold;
			color: #1a2a4a;
			margin-bottom: 40px;
			border-left: 10px solid #1a2a4a;
			padding-left: 20px;
		}

		.section {
			margin-bottom: 45px;
		}

		.section-title {
			font-size: 28px;
			font-weight: bold;
			margin-bottom: 25px;
			color: #1a2a4a;
		}

		/* =========================
		   ラジオボタン
		========================= */

		.radio-group {
			display: flex;
			flex-direction: column;
			gap: 18px;
		}

		.radio-card {
			border: 2px solid #d7e0ea;
			border-radius: 18px;
			padding: 18px 20px;
			background: #fafafa;
			transition: 0.25s;
		}

		.radio-card:hover {
			border-color: #8fa8c8;
			background: #f2f7fc;
		}

		.radio-card label {
			font-size: 18px;
			font-weight: bold;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 12px;
		}

		/* =========================
		   入力エリア
		========================= */

		.input-area {
			margin-top: 18px;
			padding: 25px;
			border-radius: 20px;
			background: #f8fafc;
			border: 2px solid #d7e0ea;
		}

		.form-group {
			margin-bottom: 20px;
		}

		.form-group label {
			display: block;
			font-weight: bold;
			margin-bottom: 8px;
			color: #1a2a4a;
		}

		.form-input {
			width: 100%;
			max-width: 400px;
			padding: 14px;
			border: 2px solid #d7e0ea;
			border-radius: 12px;
			font-size: 16px;
			box-sizing: border-box;
			transition: 0.2s;
		}

		.form-input:focus {
			outline: none;
			border-color: #1a2a4a;
			background: white;
		}

		/* =========================
		   クーポン
		========================= */

		.coupon-list {
			display: flex;
			flex-direction: column;
			gap: 15px;
		}

		.coupon-item {
			background: #fafafa;
			border: 2px solid #d7e0ea;
			border-radius: 18px;
			padding: 18px;
			transition: 0.2s;
		}

		.coupon-item:hover {
			background: #f2f7fc;
			border-color: #8fa8c8;
		}

		/* =========================
		   ボタン
		========================= */

		.button-area {
			display: flex;
			gap: 20px;
			margin-top: 40px;
			flex-wrap: wrap;
		}

		.btn {
			padding: 16px 35px;
			border: none;
			border-radius: 15px;
			font-size: 17px;
			font-weight: bold;
			cursor: pointer;
			transition: 0.25s;
			text-decoration: none;
			display: inline-block;
		}

		.back-btn {
			background: #dfe5ec;
			color: #333;
		}

		.back-btn:hover {
			background: #cfd7e0;
			transform: translateY(-2px);
		}

		.submit-btn {
			background: #1a2a4a;
			color: white;
		}

		.submit-btn:hover {
			background: #2a3d63;
			transform: translateY(-2px);
		}

		/* =========================
		   エラー
		========================= */

		.error {
			color: #d62828;
			font-weight: bold;
			margin-top: 15px;
			font-size: 16px;
		}

		/* =========================
		   レスポンシブ
		========================= */

		@media screen and (max-width: 768px) {

			.payment-wrapper {
				padding: 25px;
			}

			.page-title {
				font-size: 30px;
			}

			.section-title {
				font-size: 24px;
			}

			.form-input {
				max-width: 100%;
			}

			.button-area {
				flex-direction: column;
			}

			.btn {
				width: 100%;
				text-align: center;
				box-sizing: border-box;
			}
		}
	</style>

	<script>
		function toggleCardArea() {
			const credit = document.getElementById("credit");
			const cardArea = document.getElementById("cardArea");

			if (credit.checked) {
				cardArea.style.display = "block";
			} else {
				cardArea.style.display = "none";
			}
		}

		function toggleAddressArea() {
			const other = document.getElementById("other");
			const otherAddressArea = document.getElementById("otherAddressArea");

			if (other.checked) {
				otherAddressArea.style.display = "block";
			} else {
				otherAddressArea.style.display = "none";
			}
		}

		window.onload = function () {
			toggleCardArea();
			toggleAddressArea();
		}
	</script>

</head>

<body>

	<div class="container">

		<div th:replace="~{layout/_header :: header}"></div>

		<div class="payment-wrapper">

			<h1 class="page-title">
				決済
			</h1>

<form th:action="@{/payment/order}" method="post">
	
				<!-- 配送先 -->
				<section class="section">

					<h2 class="section-title">配送先</h2>

					<div class="radio-group">

						<div class="radio-card">
							<label>
								<input type="radio"
									   name="deliveryType"
									   value="home"
									   onchange="toggleAddressArea()"
									   th:checked="${deliveryType == null or deliveryType == 'home'}">

								ご自宅に配送
							</label>
						</div>

						<div class="radio-card">

							<label>
								<input type="radio"
									   name="deliveryType"
									   value="other"
									   id="other"
									   onchange="toggleAddressArea()"
									   th:checked="${deliveryType == 'other'}">

								別の住所に配送
							</label>

							<div id="otherAddressArea"
								 class="input-area"
								 style="display:none;">

								<div class="form-group">
									<label>郵便番号</label>
									<input type="text"
										   name="postalCode"
										   pattern="\d{7}"
										   maxlength="7"
										   class="form-input"
										   placeholder="例：0600001">
								</div>

								<div class="form-group">
									<label>住所</label>
									<input type="text"
										   name="otherAddress"
										   class="form-input"
										   placeholder="住所を入力">
								</div>

								<div class="form-group">
									<label>お名前</label>
									<input type="text"
										   name="otherName"
										   class="form-input"
										   placeholder="お届け先のお名前">
								</div>

							</div>

						</div>

					</div>

				</section>

				<!-- クーポン -->
				<section class="section">

					<h2 class="section-title">クーポン</h2>

					<div th:if="${coupons != null and !coupons.isEmpty()}">

						<p style="margin-bottom:20px;">
							利用するクーポンを選択してください
						</p>

						<div class="coupon-list">

							<div th:each="coupon : ${coupons}"
								 class="coupon-item">

								<label style="font-weight:bold; cursor:pointer;">

									<input type="radio"
										   name="couponId"
										   th:value="${coupon.id}">

									<span th:text="${coupon.name}"></span>
									｜
									<span th:text="${coupon.discountValue}"></span>円引き

								</label>

							</div>

						</div>

					</div>

					<div th:if="${coupons == null or coupons.isEmpty()}">
						<p>利用できるクーポンはありません。</p>
					</div>

				</section>

				<!-- 支払い方法 -->
				<section class="section">

					<h2 class="section-title">お支払い方法</h2>

					<div class="radio-group">

						<div class="radio-card">
							<label>
								<input type="radio"
									   name="paymentMethod"
									   value="PayPay"
									   onchange="toggleCardArea()"
									   checked>

								PayPay
							</label>
						</div>

						<div class="radio-card">
							<label>
								<input type="radio"
									   name="paymentMethod"
									   value="ApplePay"
									   onchange="toggleCardArea()">

								Apple Pay
							</label>
						</div>

						<div class="radio-card">

							<label>
								<input type="radio"
									   name="paymentMethod"
									   value="クレジットカード"
									   id="credit"
									   onchange="toggleCardArea()">

								クレジットカード
							</label>

							<div id="cardArea"
								 class="input-area"
								 style="display:none;">

								<div class="form-group">
									<label>カード番号</label>
									<input type="text"
										   name="cardNumber"
										   maxlength="16"
										   placeholder="16桁の数字"
										   class="form-input">
								</div>

								<div class="form-group">
									<label>有効期限（月）</label>
									<input type="number"
										   name="expireMonth"
										   min="1"
										   max="12"
										   class="form-input">
								</div>

								<div class="form-group">
									<label>有効期限（年）</label>
									<input type="number"
										   name="expireYear"
										   class="form-input">
								</div>

							</div>

						</div>

					</div>

				</section>

				<p class="error" th:text="${errorMessage}"></p>

				<div class="button-area">

					<a th:href="@{/cart}" class="btn back-btn">
						カートに戻る
					</a>

					<button type="submit" class="btn submit-btn">
						最終確認へ進む
					</button>

				</div>

			</form>

		</div>

		<div th:replace="~{layout/_footer :: footer}"></div>

	</div>

</body>

</html>

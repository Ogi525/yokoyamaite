<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>カテゴリー一覧</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:sans-serif;
    background:#f5f5f5;
}

.container{
    width:95%;
    max-width:1400px;
    margin:20px auto;
}

/* タイトル */

.page-title{
    font-size:40px;
    font-weight:bold;
    color:#005b96;
    margin-bottom:30px;
    border-left:10px solid #005b96;
    padding-left:15px;
}

/* =========================
   カテゴリー一覧
========================= */

.category-grid{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:18px;
}

/* カード */

.category-card{

    background:white;

    border-radius:20px;

    padding:30px 15px;

    text-align:center;

    text-decoration:none;

    color:#333;

    border:3px solid #b7d8ef;

    transition:0.3s;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.08);
}

.category-card:hover{

    transform:translateY(-5px);

    background:#f0f8ff;

    box-shadow:
        0 10px 20px rgba(0,0,0,0.15);
}

/* アイコン */

.category-icon{
    font-size:55px;
    margin-bottom:15px;
}

.category-name{
    font-size:20px;
    font-weight:bold;
    color:#005b96;
}

/* =========================
   通常検索ボタン
========================= */

.search-button-area{
    margin-top:40px;
    text-align:center;
}

.search-button{

    display:inline-block;

    padding:18px 40px;

    background:#005b96;

    color:white;

    text-decoration:none;

    border-radius:18px;

    font-size:20px;

    font-weight:bold;

    transition:0.3s;

    box-shadow:
        0 5px 10px rgba(0,0,0,0.15);
}

.search-button:hover{

    background:#0077c2;

    transform:translateY(-3px);
}

/* =========================
   レスポンシブ
========================= */

@media screen and (max-width:900px){

    .category-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media screen and (max-width:600px){

    .category-grid{
        grid-template-columns:1fr;
    }

    .page-title{
        font-size:30px;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="page-title">
        カテゴリー一覧
    </div>

    <div class="category-grid">

        <!-- 肉 -->
        <a th:href="@{/searchresult(categories=1)}"
           class="category-card">

            <div class="category-icon">🥩</div>

            <div class="category-name">
                肉
            </div>

        </a>

        <!-- 海鮮 -->
        <a th:href="@{/searchresult(categories=2)}"
           class="category-card">

            <div class="category-icon">🦀</div>

            <div class="category-name">
                海鮮
            </div>

        </a>

        <!-- 野菜 -->
        <a th:href="@{/searchresult(categories=3)}"
           class="category-card">

            <div class="category-icon">🥬</div>

            <div class="category-name">
                野菜
            </div>

        </a>

        <!-- 飲料 -->
        <a th:href="@{/searchresult(categories=4)}"
           class="category-card">

            <div class="category-icon">🥤</div>

            <div class="category-name">
                飲料
            </div>

        </a>

        <!-- お酒 -->
        <a th:href="@{/searchresult(categories=5)}"
           class="category-card">

            <div class="category-icon">🍶</div>

            <div class="category-name">
                お酒
            </div>

        </a>

        <!-- 菓子類 -->
        <a th:href="@{/searchresult(categories=6)}"
           class="category-card">

            <div class="category-icon">🍪</div>

            <div class="category-name">
                菓子類
            </div>

        </a>

    </div>

    <!-- 通常検索へ -->

    <div class="search-button-area">

        <a th:href="@{/search}"
           class="search-button">

            検索画面へ

        </a>

    </div>

</div>

</body>
</html>

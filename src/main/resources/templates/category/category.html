<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>カテゴリー一覧</title>

	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: sans-serif;
			background: #f5f5f5;
		}

		.container {
			width: 95%;
			max-width: 1400px;
			margin: 20px auto;
		}

		/* =========================
   ヘッダー
========================= */

		header {
			background: white;
			padding: 20px;
			border-radius: 20px;
			margin-bottom: 30px;
		}

		.top-menu {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.logo {
			font-size: 32px;
			font-weight: bold;
			color: #1a2a4a;
		}

		.logo a {
			text-decoration: none;
			color: #1a2a4a;
		}

		.nav {
			display: flex;
			gap: 20px;
		}

		.nav a {
			text-decoration: none;
			color: #333;
			font-weight: bold;
		}

		/* 右側 */
		.right-area {
			display: flex;
			align-items: center;
			gap: 20px;
		}


		.icon-box {
			display: flex;
			gap: 15px;
			align-items: center;
		}

		.icon-btn {
			font-size: 26px;
			text-decoration: none;
			color: #333;
			transition: 0.2s;
		}

		.icon-btn:hover {
			transform: scale(1.2);
			color: #1a2a4a;
		}

		/* タイトル */

		.page-title {
			font-size: 40px;
			font-weight: bold;
			color: #1a2a4a;
			margin-bottom: 30px;
			border-left: 10px solid #1a2a4a;
			padding-left: 15px;
		}

		/* =========================
   カテゴリー一覧
========================= */

		.category-grid {

			display: grid;

			grid-template-columns: repeat(3, 1fr);

			gap: 18px;
		}

		/* カード */

		.category-card {

			background: white;

			border-radius: 20px;

			padding: 30px 15px;

			text-align: center;

			text-decoration: none;

			color: #333;

			border: 3px solid #8fa8c8;

			transition: 0.3s;

			box-shadow:
				0 5px 15px rgba(0, 0, 0, 0.08);
		}

		.category-card:hover {

			transform: translateY(-5px);

			background: #eef2f8;

			box-shadow:
				0 10px 20px rgba(0, 0, 0, 0.15);
		}

		/* アイコン */

		.category-icon {
			font-size: 55px;
			margin-bottom: 15px;
		}

		.category-name {
			font-size: 20px;
			font-weight: bold;
			color: #1a2a4a;
		}

		/* =========================
   通常検索ボタン
========================= */

		.search-button-area {
			margin-top: 40px;
			text-align: center;
			margin-bottom: 40px; 
		}

		.search-button {

			display: inline-block;

			padding: 18px 40px;

			background: #1a2a4a;

			color: white;

			text-decoration: none;

			border-radius: 18px;

			font-size: 20px;

			font-weight: bold;

			transition: 0.3s;

			box-shadow:
				0 5px 10px rgba(0, 0, 0, 0.15);
		}

		.search-button:hover {

			background: #2a4a7a;

			transform: translateY(-3px);
		}

		/* =========================
   フッター
========================= */

		footer {

			background: white;

			padding: 25px;

			border-radius: 20px;

			text-align: center;
		}

		footer a {
			text-decoration: none;
			color: #333;
			margin: 0 10px;
		}

		/* =========================
   レスポンシブ
========================= */

		@media screen and (max-width:900px) {

			.category-grid {
				grid-template-columns: repeat(2, 1fr);
			}
		}

		@media screen and (max-width:600px) {

			.category-grid {
				grid-template-columns: 1fr;
			}

			.page-title {
				font-size: 30px;
			}
		}
	</style>

</head>

<body>

	<div class="container">
		<div th:replace="~{layout/_header :: header}"></div>


		<div class="page-title">
			カテゴリー一覧
		</div>

		<div class="category-grid">

			<!-- 肉 -->
			<a th:href="@{/searchresult(categories=1)}" class="category-card">

				<div class="category-icon">🥩</div>

				<div class="category-name">
					肉
				</div>

			</a>

			<!-- 海鮮 -->
			<a th:href="@{/searchresult(categories=2)}" class="category-card">

				<div class="category-icon">🦀</div>

				<div class="category-name">
					海鮮
				</div>

			</a>

			<!-- 野菜 -->
			<a th:href="@{/searchresult(categories=3)}" class="category-card">

				<div class="category-icon">🥬</div>

				<div class="category-name">
					野菜
				</div>

			</a>

			<!-- 飲料 -->
			<a th:href="@{/searchresult(categories=4)}" class="category-card">

				<div class="category-icon">🥤</div>

				<div class="category-name">
					飲料
				</div>

			</a>

			<!-- お酒 -->
			<a th:href="@{/searchresult(categories=5)}" class="category-card">

				<div class="category-icon">🍶</div>

				<div class="category-name">
					お酒
				</div>

			</a>

			<!-- 菓子類 -->
			<a th:href="@{/searchresult(categories=6)}" class="category-card">

				<div class="category-icon">🍪</div>

				<div class="category-name">
					菓子類
				</div>

			</a>

		</div>

		<!-- 通常検索へ -->

		<div class="search-button-area">

			<a th:href="@{/search}" class="search-button">

				検索画面へ

			</a>

		</div>
		<div th:replace="~{layout/_footer :: footer}"></div>


	</div>

</body>

</html>

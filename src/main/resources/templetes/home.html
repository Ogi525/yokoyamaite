```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>横山蒸留所</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:sans-serif;
    background-color:#f5f5f5;
}

/* 全体 */
.container{
    width:900px;
    margin:30px auto;
    background-color:white;
    border:2px solid green;
}

/* ヘッダー */
header{
    padding:10px 20px;
    border-bottom:1px solid #ccc;
}

/* 上部メニュー */
.top-menu{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.nav{
    display:flex;
    gap:20px;
}

.nav a{
    text-decoration:none;
    color:black;
}

/* 検索 */
.search-box input{
    padding:5px;
}

/* バナー */
.banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px;
    border-bottom:1px solid #ccc;
}

.banner-message{
    text-align:center;
    flex:1;
}

.banner img{
    width:120px;
}

/* 商品エリア */
.section{
    padding:20px;
    text-align:center;
}

.section-title{
    font-size:24px;
    margin-bottom:20px;
}

/* 商品一覧 */
.product-list{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

/* 商品カード */
.product-card{
    width:120px;
}

.product-image{
    width:100px;
    height:100px;
    border:2px solid green;
    border-radius:50%;
    margin:0 auto 10px;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-name{
    font-size:14px;
}

/* フッター */
footer{
    border-top:1px solid #ccc;
    padding:20px;
    text-align:center;
    font-size:14px;
}

footer a{
    text-decoration:none;
    color:black;
    margin:0 10px;
}

/* レスポンシブ */
@media screen and (max-width:768px){

    .container{
        width:95%;
    }

    .top-menu{
        flex-direction:column;
        gap:10px;
    }

    .nav{
        flex-wrap:wrap;
        justify-content:center;
    }

    .banner{
        flex-direction:column;
        gap:20px;
    }

    .product-list{
        gap:15px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- ヘッダー -->
    <header>

        <div class="top-menu">

            <div class="logo">
                横山漁師店
            </div>

            <nav class="nav">
                <a href="#">カテゴリー</a>
                <a href="#">絞り込み</a>
                <a href="#">ミニゲーム</a>
                <a href="#">所持クーポン</a>
            </nav>

            <div class="search-box">
                <input type="text" placeholder="検索">
            </div>

        </div>

    </header>

    <!-- バナー -->
    <div class="banner">

        <div>⬅️</div>

        <img src="/images/gold-fish.png" alt="金ぴか魚">

        <div class="banner-message">
            <h2>回転寿司と同じおいしさの商品が流れてくるー</h2>
        </div>

        <div>➡️</div>

    </div>

    <!-- 新着商品 -->
    <section class="section">

        <h2 class="section-title">新着商品</h2>

        <div class="product-list">

            <!-- 商品繰り返し -->
            <div class="product-card"
                 th:each="product : ${newProducts}">

                <div class="product-image">
                    <img th:src="${product.imageUrl}">
                </div>

                <div class="product-name"
                     th:text="${product.productName}">
                </div>

            </div>

        </div>

    </section>

    <!-- ランキング -->
    <section class="section">

        <h2 class="section-title">
            新着商品と同じ感じでランキング！
        </h2>

        <div class="product-list">

            <div class="product-card"
                 th:each="product : ${rankingProducts}">

                <div class="product-image">
                    <img th:src="${product.imageUrl}">
                </div>

                <div class="product-name"
                     th:text="${product.productName}">
                </div>

            </div>

        </div>

    </section>

    <!-- フッター -->
    <footer>

        <a href="#">お問い合わせ</a> |
        <a href="#">利用規約</a> |
        <a href="#">プライバシーポリシー</a> |
        <a href="#">配送について</a> |
        <a href="#">FAQ</a>

    </footer>

</div>

</body>
</html>
```
